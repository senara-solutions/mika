[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.12.2"
edition = "2024"
license = "MIT"
description = "AI executive assistant with persistent memory"
repository = "https://github.com/senara-solutions/mika"
homepage = "https://github.com/senara-solutions/mika"
keywords = ["ai", "assistant", "cli", "llm", "agent"]
categories = ["command-line-utilities"]
rust-version = "1.91"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "=0.1.7-alpha.10"

# Zero-copy conversions (f32 slices → bytes for sqlite-vec)
zerocopy = "0.8"

# Regex
regex = "1"

# Configuration
config = "0.15"
toml = "1.1"
toml_edit = "0.25"
dotenvy = "0.15"

# Directories
dirs = "6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# OpenTelemetry (optional per-crate via "telemetry" feature)
# Les QUATRE montent ensemble : tracing-opentelemetry <N> exige opentelemetry ^<N-1>
# (0.34 → ^0.33). Un bump partiel produit deux copies dans le graphe, que cargo
# résout sans erreur et que seul `--features telemetry` refuse — mika#2523.
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto"] }
tracing-opentelemetry = "0.34"

# Error handling
anyhow = "1.0.103"
thiserror = "2"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"

# Async trait
async-trait = "0.1"

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
async-stream = "0.3"

# HTTP
http = "1"

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit", "set-header", "cors"] }
subtle = "2"
http-body-util = "0.1"

# Security
secrecy = { version = "0.10", features = ["serde"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "yaml"] }

# CLI / TUI
clap = { version = "4", features = ["derive"] }
clap-markdown = "0.1"
# unstable-rendered-line-info: enables Paragraph::line_count() for accurate scroll (stable in practice since 0.25)
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
tui-textarea = { version = "0.9", package = "ratatui-textarea", features = ["crossterm"] }
crossterm = "0.29"

# Encoding
base64 = "0.23"
bytes = "1"

# Clipboard & Image encoding
arboard = { version = "3", features = ["image-data"] }
png = "0.18"

# Unicode
unicode-width = "0.2"
unicode-normalization = "0.1"

# MCP (Model Context Protocol)
rmcp = { version = "2.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }

# Postgres (mika-gateway)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json"] }

# Embedded assets
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# URL parsing
url = "2"

# JWT — GitHub App RS256 signing (crates/mika-common/src/github_app.rs).
#
# `features = ["aws_lc_rs"]` est LOAD-BEARING, pas cosmétique (mika#2525).
# jsonwebtoken 11 a retiré `ring` pour une architecture à provider enfichable :
# son `default` ne porte QUE `use_pem`, donc aucun backend crypto n'est actif
# par défaut et tout appel à `encode`/`decode` PANIQUE à l'exécution — sur un
# build parfaitement vert. Exactement une des deux features
# `rust_crypto`/`aws_lc_rs` doit être active : le `cfg` de
# `crypto::CryptoProvider::from_crate_features` est une cascade EXCLUSIVE, donc
# en activer deux en active zéro et rend la même panique.
#
# `aws_lc_rs` plutôt que `rust_crypto`, et le décompte est MESURÉ sur
# `git diff Cargo.lock` (jamais sur `cargo tree`, qui montre le graphe et non les
# features effectives) : aws-lc-rs 1.18 est déjà dans l'arbre via
# reqwest -> hyper-rustls -> rustls et via sqlx, mais l'activer ici ajoute quand
# même DEUX crates — `untrusted 0.7.1` et `zeroize_derive 1.5.0` — parce que
# rustls déclare aws-lc-rs avec `default-features = false` là où jsonwebtoken le
# déclare sans. Ce n'est donc pas gratuit ; c'est moins cher que `rust_crypto`,
# qui ajouterait ed25519-dalek, p256 et p384. La toolchain native d'aws-lc-sys
# est déjà satisfaite partout où mika se construit, puisque sqlx active
# `tls-rustls-aws-lc-rs`.
#
# NE PAS poser `default-features = false` : ça retire `use_pem`, donc
# `EncodingKey::from_rsa_pem`, appelé à trois sites de PRODUCTION
# (github_app.rs:95, :131, mika-cli/src/commands/doctor.rs:536).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

# Process management (Linux)
libc = "0.2"

# Utilities
rand = "0.10"
hex = "0.4"
hmac = "0.12"
lru = "0.16"
sha2 = "0.10"
dialoguer = "0.12"

# Testing
tempfile = "3"
serial_test = "4"
# HTTP mock server for wiremock-style integration tests (mika-gateway egress-search)
wiremock = "0.6"
# mtime stamping for the mika#2249 worktree-activity probe tests. std can read
# mtimes but not set them, and those tests need backdated worktrees to pin the
# reaper threshold. Already in the tree as a transitive dep of `tar`.
filetime = "0.2"

# Concurrent collections
dashmap = "6"

# Workspace crates (path-only — no version needed since all are publish = false)
mika-common = { path = "crates/mika-common" }
mika-agent = { path = "crates/mika-agent" }
mika-a2a = { path = "crates/mika-a2a" }
mika-os = { path = "crates/mika-os" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Workspace-wide clippy lints (mika#1724 — wedge-class prevention).
#
# `significant_drop_in_scrutinee` is a nursery lint that catches the
# mika#1719 bug shape: a `match lock.get(...)` scrutinee holds its RAII
# guard across every arm, deadlocking against a same-thread writer
# reached from inside an arm. Nursery lints require explicit opt-in.
#
# `await_holding_invalid_types` is warn-by-default but its trigger set is
# empty until `await-holding-invalid-types` in `clippy.toml` names the
# guard types. The DashMap footgun list lives there.
[workspace.lints.clippy]
significant_drop_in_scrutinee = "warn"
