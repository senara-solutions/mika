[skill]
name = "mika-arch-groom-ticket"
description = "First-pass principle-grounded plan review — produces READY / ITERATE / ESCALATE disposition with annotated plan content."
version = "0.1.0"
always_on = false
timeout_secs = 120

[triggers]
keywords = [
    "groom-ticket",
    "review-plan",
    "architect-review",
    "arch-review",
    "first-review",
    "plan review",
    "architecture review",
]

[constraints]
required_tools = ["gh_read"]
required_fetches_for_quoted_resources = true

[output]
required_suffix_lines = ["Disposition: READY", "Disposition: ITERATE", "Disposition: ESCALATE"]
required_finding_list_prefixes = ["F1:", "F2:", "F3:", "F4:", "F5:", "F6:", "F7:", "F8:", "F9:", "F10:"]
