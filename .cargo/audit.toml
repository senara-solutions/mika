# cargo-audit configuration
# Used by the rustsec/audit-check GitHub Action

[advisories]
ignore = [
    # rsa Marvin Attack — pulled in transitively by sqlx-mysql; no patch
    # available upstream. Not exploitable in our usage (no RSA operations).
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30.1 (bundled SQLite < 3.54.0), pulled in by rusqlite 0.32
    # (Cargo.toml:30). The fix (>= 0.39.0) needs a major rusqlite bump to 0.41.
    # Temporary exception set 2026-11-09, approved by Vincent; the bump is tracked
    # on the parking mika#2983 for a dedicated flight. Keep in sync with deny.toml.
    "RUSTSEC-2026-0459",
]
