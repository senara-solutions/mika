# cargo-audit configuration
# Used by the rustsec/audit-check GitHub Action

[advisories]
ignore = [
    # rsa Marvin Attack — pulled in transitively by sqlx-mysql; no patch
    # available upstream. Not exploitable in our usage (no RSA operations).
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30.1 (bundled SQLite < 3.54.0), tirée par rusqlite 0.32
    # (Cargo.toml:30). Exception temporaire posée le 2026-11-09, approuvée par
    # Vincent ; coût re-mesuré le 2026-11-24 (mika#3131).
    #
    # Le remède — libsqlite3-sys >= 0.39.0, atteint par rusqlite 0.41.1 — est une
    # CASCADE de trois montées, pas une :
    #   1. rusqlite 0.32 -> 0.41 (484 sites d'adaptation d'API, 50 fichiers) ;
    #   2. sqlx 0.8 -> 0.9, FORCÉ : rusqlite 0.41 et sqlx 0.8.6 déclarent tous deux
    #      links = "sqlite3" dans des versions différentes de libsqlite3-sys, donc
    #      cargo refuse de résoudre le graphe (montée majeure, mika-gateway) ;
    #   3. rustc 1.93 -> 1.94, FORCÉ par l'étage 2 : sqlx 0.9.1 exige 1.94.0 alors
    #      que rust-toolchain.toml fixe 1.93 et Cargo.toml:14 déclare 1.91.
    #
    # Classe OPERATEUR, non dispatchable : le bac à sable monte
    # ~/.cargo/registry/src en lecture seule, donc aucune caisse nouvelle ne peut
    # être dépaquetée et rien de ce graphe ne se compile.
    # Procédure : docs/plans/2026-11-24-001-chore-3131-rusqlite-0-41-cascade-plan.md
    # Keep in sync with deny.toml.
    "RUSTSEC-2026-0459",
]
