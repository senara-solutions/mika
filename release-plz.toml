[workspace]
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
semver_check = false
pr_labels = ["release"]

# mika-common is the only released package. It drives the unified version,
# changelog, git tag, and GitHub release. All other crates are publish = false
# and release = false because cargo package can't resolve workspace deps
# (e.g., mika-a2a ^0.3.2) from crates.io where they were never published.
# Their commits flow into the changelog via changelog_include.
[[package]]
name = "mika-common"
publish = false
release = true
changelog_path = "CHANGELOG.md"
changelog_include = ["mika-agent", "mika-cli", "mika-a2a"]

[[package]]
name = "mika-agent"
publish = false
release = false

[[package]]
name = "mika-cli"
publish = false
release = false

[[package]]
name = "mika-a2a"
publish = false
release = false

[[package]]
name = "mika-gateway"
publish = false
release = false

[changelog]
header = """# Changelog\n\nAll notable changes to this project will be documented in this file.\n"""
body = """
## [{{ version }}](https://github.com/senara-solutions/mika/releases/tag/v{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message }}
{%- endfor %}
{% endfor %}
"""
trim = true
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Performance" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", skip = true },
    { message = "^ci", skip = true },
    { message = "^chore", skip = true },
    { message = "^style", skip = true },
]
