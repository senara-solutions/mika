[package]
name = "mika-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Agent engine and HTTP server for Mika AI assistant"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "mika-spirit"
path = "src/bin/mika-spirit.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[[bin]]
name = "eval-diff"
path = "src/bin/eval-diff.rs"

[[bin]]
name = "verify-bundled-skills"
path = "src/bin/verify_bundled_skills.rs"

[features]
telemetry = ["mika-common/telemetry"]
# Ouvre les onze points d'entrée du défaut 44 aux crates externes (mika#1727
# vol V4-c). Éteinte par défaut : hors de mika-agent, un lancement d'agent,
# d'équipe ou du moteur de tâches ne compile pas. Allumée pour les tests du
# crate par la dev-dépendance sur soi-même, plus bas.
test-support = []

[dependencies]
mika-common.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sqlite-vec.workspace = true
zerocopy.workspace = true
tracing.workspace = true
anyhow.workspace = true
toml.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true
async-trait.workspace = true
axum.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
subtle.workspace = true
secrecy.workspace = true
utoipa.workspace = true
base64.workspace = true
rmcp.workspace = true
http.workspace = true
tempfile.workspace = true
rust-embed.workspace = true
mika-a2a.workspace = true
dashmap.workspace = true
url.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
clap.workspace = true
yaml_serde.workspace = true
flate2 = "1"
tar = "0.4"
unicode-normalization.workspace = true

# `cfg(unix)` et non `cfg(target_os = "linux")` : le `Drop` de
# `ProcessGroupKillGuard` (`src/skills/executor.rs`) appelle `libc::killpg` hors
# de tout `#[cfg]`, et `release.yml` construit aussi les deux cibles darwin
# (mika#2900). La clé ne sur-approxime pas — `executor.rs` appelle
# `.process_group(0)`, méthode de `std::os::unix::process::CommandExt`, donc le
# crate n'est de toute façon compilable sur aucune cible non-unix.
# Garde : `tests/libc_target_scope_2900.rs`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
mika-common = { workspace = true, features = ["test-utils"] }
serial_test.workspace = true
filetime.workspace = true
tracing-subscriber.workspace = true
# wiremock-backed dev-dep for gateway substrate delegation tests.
# Consumers: mika#1969 (fetch_url builtin) + mika#1971 (web_search substrate cut).
# Reuses the workspace pin also used by mika-gateway's egress-search/egress-fetch tests.
wiremock.workspace = true
# Dev-dépendance sur soi-même : la seule façon d'allumer `test-support` pour les
# cibles de test du paquet sans l'allumer pour sa lib ni pour ses binaires. Un
# `#[cfg(any(test, feature = …))]` ne suffirait pas : un fichier de `tests/` est
# un crate séparé, qui ne voit pas le `cfg(test)` de la lib dont il dépend. Sous
# le résolveur de l'edition 2024, les features d'une dev-dépendance s'unifient
# dans les builds qui incluent les cibles de test (`cargo test`, `--all-targets`)
# et PAS dans `cargo check -p mika-agent` ni dans `cargo build` (mika#1727 V4-c).
mika-agent = { path = ".", features = ["test-support"] }

[lints]
workspace = true
