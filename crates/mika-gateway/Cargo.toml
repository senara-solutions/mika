[package]
name = "mika-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Telegram webhook gateway for Mika AI assistant"
repository.workspace = true
publish = false

[[bin]]
name = "mika-gateway"
path = "src/main.rs"

[dependencies]
mika-common = { workspace = true }
mika-a2a = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
subtle = { workspace = true }
secrecy = { workspace = true }
tower-http = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
rustls = "0.23"
utoipa.workspace = true
base64.workspace = true
bytes.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
lru.workspace = true
dashmap.workspace = true
rand = { workspace = true }
chrono = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
mika-common = { workspace = true, features = ["test-utils"] }
jsonwebtoken = { workspace = true }
# For the #[ignore]'d DB-backed admin_customers integration test (mika#1612).
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# egress_search #1807 log-assertion test needs `Registry` + `SubscriberExt`
# to attach a capturing Layer. Workspace features already carry json+env-filter.
tracing-subscriber = { workspace = true, features = ["registry"] }
