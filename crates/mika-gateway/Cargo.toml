[package]
name = "mika-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Telegram webhook gateway for Mika AI assistant"
repository.workspace = true
publish = false

[[bin]]
name = "mika-gateway"
path = "src/main.rs"

# mika#1796 — expose the `voice` module (build-time non-transit invariant) as a
# library surface so trybuild compile-fail fixtures under
# `tests/voice_lane_compile_fail/` can `use mika_gateway::voice::...`. Bin and
# lib share `src/`; main.rs remains the sole binary entry point and continues
# to declare its own private modules.
[lib]
name = "mika_gateway"
path = "src/lib.rs"

[features]
# mika#1796 — gate the stub provider types in `voice::examples` behind this
# feature so they NEVER ship in the release surface. Test-only fixtures use
# `#[cfg(test)]` for in-crate access; external users (trybuild fixtures under
# `tests/voice_lane_compile_fail/`) get access when the feature is enabled.
# Mirrors the `test-utils` feature convention in `mika-common`.
test-utils = []

[dependencies]
mika-common = { workspace = true }
mika-a2a = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
subtle = { workspace = true }
secrecy = { workspace = true }
tower-http = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
rustls = "0.23"
utoipa.workspace = true
base64.workspace = true
bytes.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
lru.workspace = true
dashmap.workspace = true
rand = { workspace = true }
chrono = { workspace = true }
async-stream = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
mika-common = { workspace = true, features = ["test-utils"] }
jsonwebtoken = { workspace = true }
# For the #[ignore]'d DB-backed admin_customers integration test (mika#1612).
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# egress_search #1807 log-assertion test needs `Registry` + `SubscriberExt`
# to attach a capturing Layer. Workspace features already carry json+env-filter.
tracing-subscriber = { workspace = true, features = ["registry"] }
# Brave client integration tests (mika#1808) use wiremock to stand in for the
# Brave Search API — no real network calls in the test binary.
wiremock = { workspace = true }
# mika#1796 — voice-lane compile-fail fixtures. Asserts that wiring a cloud
# STT/TTS type into `VoiceRoom<TestimonyLane, _, _>` is rejected by the
# type-checker (the build-time non-transit invariant). Snapshot .stderr is
# pinned to the toolchain in `rust-toolchain.toml` (1.93); a toolchain bump
# refreshes it via `TRYBUILD=overwrite cargo test -p mika-gateway --test voice_lane_compile_fail`.
trybuild = "1"

[lints]
workspace = true
