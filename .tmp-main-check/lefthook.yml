# Lefthook — pre-commit quality gates for mika (Rust + TypeScript)
# https://github.com/evilmartians/lefthook
#
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      stage_fixed: true

    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
      stage_fixed: true

    dashboard-lint:
      glob: "dashboard/**/*.{ts,tsx,js,jsx}"
      run: npm run lint -w dashboard
      stage_fixed: true

    dashboard-typecheck:
      glob: "dashboard/**/*.{ts,tsx}"
      run: npx tsc --noEmit -p dashboard/tsconfig.json

    ui-typecheck:
      glob: "packages/ui/**/*.{ts,tsx}"
      run: npx tsc --noEmit -p packages/ui/tsconfig.json

    toml-syntax:
      glob: "*.toml"
      run: >
        for f in {staged_files}; do
          python3 -c "import tomllib; tomllib.load(open('$f','rb'))" 2>&1 || exit 1;
        done

    # Secret scan + 1MB large-file cap — both delegate to the shared scanner
    # (scripts/check-secrets.sh), the single source of truth also consumed by the
    # CI `secret-scan` job. The `--no-verify` rescue path (mika#1685) bypasses this
    # whole pre-commit block, so CI carries the same net; keeping the regex + 1MB
    # threshold in one script means the two nets cannot drift (mika#1689).
    no-secrets-and-large-files:
      run: bash scripts/check-secrets.sh {staged_files}
