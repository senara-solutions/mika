# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[[advisories.ignore]]
id = "RUSTSEC-2026-0253"
reason = "lru LruCache::pop panic-safety (unsound); transitive dep only, we do not pass panicking Drop keys to pop()."

[[advisories.ignore]]
id = "RUSTSEC-2026-0221"
reason = "event-listener !Send tags via StackSlot (unsound); transitive dep only, we do not share listeners across threads on custom !Send types."

[[advisories.ignore]]
id = "RUSTSEC-2026-0205"
reason = "scc Array::insert exception safety (unsound); transitive dep only, we do not pass panicking compare fns."

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# mika#1796 — voice testimony lane non-transit invariant.
#
# Cloud STT/TTS providers may NEVER be pulled into the workspace, because
# the testimony lane's "no audio leaves the box" doctrine must be verified
# by construction (see docs/voice-non-transit-invariant.md and the type-level
# lane separation in crates/mika-gateway/src/voice/). Blocking these crates
# at the dependency graph is the second of three composed defenses (types +
# cargo-deny bans + CI lint).
#
# Escape process — if a legitimate CONVERSATION-lane feature needs one of
# these crates:
#   1. Extract that feature into a separate crate that is NEVER pulled into
#      the testimony code path.
#   2. Add an entry to [bans.allow] below whose comment names the extracted
#      crate path: `see #NNNN — crate extracted to crates/<name>/`.
#      Bare `see #NNNN` (no crate path) is not enough — a reviewer running
#      `grep bans.allow deny.toml` must be able to audit the extraction
#      point without following a link.
deny = [
    # cargo-deny matches crate names verbatim (hyphen vs underscore matters),
    # so both spellings of every provider are enumerated. If a NEW cloud
    # STT/TTS provider ships, add BOTH spellings here.
    #
    # ElevenLabs (cloud TTS)
    { name = "elevenlabs" },
    { name = "elevenlabs-rs" },
    { name = "elevenlabs_rs" },
    # Deepgram (cloud STT)
    { name = "deepgram" },
    { name = "deepgram-rs" },
    { name = "deepgram_rs" },
    # Azure Cognitive Services Speech
    { name = "azure-speech" },
    { name = "azure_speech" },
    { name = "azure-cognitiveservices-speech" },
    # Google Cloud Speech-to-Text / Text-to-Speech
    { name = "google-speech" },
    { name = "google-cloud-speech" },
    { name = "google-cloud-speech-v1" },
    { name = "google-cloud-texttospeech" },
    { name = "google-cloud-texttospeech-v1" },
    # AWS Transcribe / Polly
    { name = "aws-sdk-transcribe" },
    { name = "aws-sdk-polly" },
    { name = "aws-sdk-transcribestreaming" },
    # AssemblyAI (cloud STT)
    { name = "assemblyai" },
    { name = "assemblyai-rs" },
    # Rev.ai (cloud STT)
    { name = "rev_ai" },
    { name = "rev-ai" },
    # Speechmatics (cloud STT)
    { name = "speechmatics" },
    # OpenAI Whisper-API clients (cloud STT via OpenAI's Whisper endpoint —
    # LOCAL Whisper via `whisper-cpp` / `whisper-rs` is fine and is what
    # the testimony lane uses).
    { name = "async-openai" },
    { name = "openai-api-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
