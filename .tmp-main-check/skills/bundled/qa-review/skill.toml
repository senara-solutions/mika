[skill]
name = "qa-review"
description = "Quality gate for PR review — produces structured pass/hold/block verdicts for mika-dev"
version = "0.9.1"
always_on = true
# Written explicitly since mika#2276 (AC5), not because the value changed — 30 is
# the manifest default and stays it — but because the value is now LOAD-BEARING.
# Before mika#2276 a skill's declared timeout was applied to every tool in the
# turn only via `max_skill_timeout`'s maximum, so this skill's own tool ran under
# whichever loaded skill was most generous (300 s, from the `build-mika`
# dependency two lines below). Declaring it makes the number a decision instead
# of a default nobody read. `qa_pr_view` is one `gh pr view --json` call; 30 s is
# roughly 10× its nominal cost.
timeout_secs = 30
# Raised from 57344 (56 KB) to 65536 (64 KB) for mika#1729: the Dependabot
# DEP-REVIEW section (Prime's load-bearing distinct-from-CI signal) pushed the
# prompt to ~58 KB. 64 KB stays well under the 80 KB ceiling and the 95% warn
# gate (bundled_skills_approaching_max_prompt_size_warns).
#
# Raised from 65536 to 73728 (72 KB) for mika#2264. Step 2.5.4b (the implicit
# negative-test AC) plus the CI-deferred closure in 2.5.3 and the tenth row of
# the 3b table add ~5.7 KB to a prompt that sat at 61 498 bytes — 761 bytes
# under the 95 % gate, which PANICS rather than warns
# (tests/bundled_skills_load.rs:141,166). Remediation could not be "drop a
# rule": this prompt's whole subject is a closed enumeration of what blocks a
# merge, and mika#2238 measured that an unlisted branch produces a silent stop.
# Same gesture, same reason as self-dev-webhook-qa/skill.toml (mika#2248).
# 73728 < the 81 920 hard ceiling (skills/index.rs:27); the gate fires again at
# 70 041 bytes. The declared size costs nothing — the real size is injected.
# Raised from 73728 to 77824 (76 KB) for mika#2423, on 2026-09-21. U3 (the
# policy-refusal exclusion on the Data Integrity line, the diff-read condition
# on `[⏭️]` in 2.5.3, and the reason the CI boundary is kept) adds 1 370 bytes
# to a prompt that sat at 69 275 — 766 bytes under the 95 % gate. Same shape as
# the two raises above: the prompt's subject is a closed enumeration, and the
# fix for a self-contradicting rule is not to delete one of its halves.
# 77824 < the 81 920 hard ceiling; the gate fires again at 73 932 bytes.
#
# Raised from 77824 to 79872 (78 KB) for mika#2519, on 2026-09-26. Step 1.6 gains
# the `author.login` correction (`author` is an OBJECT — the old text compared it
# to a string, on the single discriminant of the whole Dependabot path, so the
# step was unreachable) and step 5b, the major-version-jump clause with its
# `API-SURFACE:` line. Net +2 281 bytes on a prompt that sat at 71 716 — 2 216 of
# which fitted under the old gate, so the raise buys the last 65 and the margin
# after them. **Roughly 900 bytes of the addition were already cut before
# raising**: the two paragraphs were compressed twice, and what remains is four
# rules, three of which are asserted by
# `tests/qa_review_executes_repo_guards.rs::mika2519_*`. Same shape as the three
# raises above, and the same reason: the fix for a missing rule is not to delete
# a neighbouring one.
#
# **+2048 and not +4096, deliberately.** 77824 + 4096 lands on 81 920, i.e. ON
# the `MAX_PROMPT_SIZE_CEILING` (`skills/index.rs:27`) — a value that satisfies
# the gate while leaving the next rule nowhere to go, and the three comments
# above all state "well under the ceiling" as part of the reasoning. 79872 clears
# the gate with 1 875 bytes of headroom and keeps 2 048 below the ceiling.
# The gate fires again at 75 878 bytes. The declared size costs nothing at
# runtime — the real size is what is injected.
max_prompt_size = 79872
# `qa-review-build-callback` est listé ici pour une raison précise et
# contre-intuitive (mika#2355 B1). Ce skill déclare déjà `dependencies =
# ["qa-review"]` — mais c'est une arête ENTRANTE, et `callback_safe_skills()`
# (`skills/mod.rs`) amorce sur les skills `always_on` puis suit en BFS les
# dépendances **sortantes**, sans aucun matching par mot-clé. Un handler de
# callback qui n'est la dépendance de personne n'est donc atteignable par
# personne : sur un tour de callback, tout son prompt était absent, y compris la
# phrase qui porte le contrat — *« A qa-review turn is ONLY complete when a
# successful run_gh("pr review …") call appears in this turn's tool history. »*
# Mesuré le 2026-09-17 : trois revues rendues « Build succeeded », zéro verdict.
#
# Classe exacte de mika#1251, résolue à l'époque pour `self-dev` seulement (voir
# le commentaire de `self-dev/skill.toml` sur ses deux frères de dispatch) et
# jamais généralisée. Le détecteur de classe qui compte désormais TOUS les
# handlers `-callback` vit dans `src/bundled_skills.rs` (`mod tests`,
# `mika2355_every_bundled_callback_handler_is_reachable_on_a_callback_turn`).
#
# Coût nommé : `qa-review` étant `always_on`, ses dépendances sont résolues sur
# TOUS ses tours, pas seulement les callbacks — +19 330 octets de prompt par
# tour mika-qa. Coût de contexte, pas de gate : `max_prompt_size` est **par
# skill**, jamais sur la somme. Le garde-fou qui rend ce coût inoffensif est
# l'en-tête de portée en tête de `qa-review-build-callback/system_prompt.md` :
# sans lui, le tour d'OUVERTURE d'une revue lirait « Steps 1–3d were completed
# in the previous turn — do NOT re-run them » et sauterait la revue de diff.
dependencies = ["github", "build-mika", "qa-review-build-callback"]

[triggers]
keywords = ["review", "pr", "qa", "pull request"]

[constraints]
required_tools = ["qa_pr_view", "run_gh", "run_shell", "build_mika"]

[context.pr_diff]
type = "gh_pr_diff"
required = false

# Engine-side verdict trailer guard (mika#899). The `--body` argument of
# `run_gh pr review` must contain one of these literal lines as a trailing
# non-empty line. Validated BEFORE subprocess spawn — missing trailer rejects
# the tool call with a corrective error so the LLM can retry with the full body.
[[output.required_tool_arg_suffixes]]
tool = "run_gh"
arg = "pr_review_body"
required_lines = [
  "VERDICT: pass",
  "VERDICT: hold[review]",
  "VERDICT: block[ac]",
  "VERDICT: block[ci]",
  "VERDICT: block[security]",
  "VERDICT: block[pipeline]",
]
