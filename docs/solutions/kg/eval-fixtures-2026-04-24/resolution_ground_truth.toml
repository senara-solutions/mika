# KG Provider Evaluation — Resolution Ground Truth
# Date: 2026-04-24
# Purpose: Hand-labeled entity resolution cases for evaluating disambiguation quality.
#
# Each case represents a Stage 2 LLM disambiguation scenario where the resolver
# must pick the correct domain entity from a candidate list, or return null.
#
# Categories:
#   clear_match       — Unambiguous match to a single domain entity (10 cases)
#   sibling_ambiguous — Close-by-name domain neighbors requiring judgment (10 cases)
#   no_match          — Entity has no valid domain counterpart (10 cases)
#
# Fields:
#   entity_key        — The extracted subject entity key (from NER output)
#   entity_confidence — The extraction confidence (0.0-1.0)
#   chunk_context     — Source prose snippet where the entity was extracted
#   expected_match    — Ground truth: the correct domain entity_key, or "null"
#   case_category     — One of: clear_match, sibling_ambiguous, no_match
#   disputable        — true if reasonable annotators might disagree
#   rationale         — Why this is the correct label
#
# candidates: array of {entity_key, description} representing the domain entities
# presented to the resolver. These mirror what domain_builder.rs would produce.

