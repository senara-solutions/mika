openapi: 3.1.0
info:
  title: Mika Gateway API
  description: Shared routing layer for Telegram/WhatsApp webhooks. Receives inbound messages, routes to per-customer agent containers, and relays outbound responses.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /livez:
    get:
      tags:
      - routes
      summary: GET /livez — Liveness probe (no auth, no DB).
      description: |-
        Returns 200 unconditionally — the fact that HTTP is responding proves liveness.
        Readiness (ready flag + DB) is checked by /readyz.
      operationId: handle_liveness
      responses:
        '200':
          description: Process is alive
  /orchestrator/inbox/{orchestrator_id}/message:
    post:
      tags:
      - orchestrator_inbox
      summary: '`POST /orchestrator/inbox/{orchestrator_id}/message`.'
      description: |-
        Bearer auth applied by `require_bearer_token` middleware. 256 KB body limit
        applied at the route layer.
      operationId: handle_post_message
      parameters:
      - name: orchestrator_id
        in: path
        description: Orchestrator session id, 1-128 chars [A-Za-z0-9_-]
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMessagePayload'
        required: true
      responses:
        '201':
          description: Message persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostMessageResponse'
        '400':
          description: Invalid orchestrator_id, malformed body, or unknown kind
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Endpoint disabled (MIKA_ORCHESTRATOR_INBOX_ENABLED unset or 0)
        '413':
          description: Body exceeds 256KB
        '500':
          description: Database write failed
      security:
      - bearer: []
  /orchestrator/inbox/{orchestrator_id}/stream:
    get:
      tags:
      - orchestrator_inbox
      summary: '`GET /orchestrator/inbox/{orchestrator_id}/stream`.'
      description: |-
        Returns `text/event-stream`. Each event:
        ```text
        id: <bigserial>
        event: message
        data: {"id":<n>,"orchestrator_id":"...","spawn_id":"...","kind":"...","body":{...},"created_at":"..."}
        ```

        Replay-from-cursor: client sends `Last-Event-Id: <last-seen-id>` and the
        server emits all rows with `id > last-seen-id`. After replay, polls every
        `ORCHESTRATOR_INBOX_POLL_INTERVAL` for new rows. `KeepAlive` emits a comment
        ping every `ORCHESTRATOR_INBOX_KEEPALIVE_INTERVAL`.
      operationId: handle_stream
      parameters:
      - name: orchestrator_id
        in: path
        description: Orchestrator session id, 1-128 chars [A-Za-z0-9_-]
        required: true
        schema:
          type: string
      - name: last-event-id
        in: header
        description: Resume cursor — server emits rows with id > this value
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      responses:
        '200':
          description: text/event-stream with replay + live tail
        '400':
          description: Invalid orchestrator_id
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Endpoint disabled (MIKA_ORCHESTRATOR_INBOX_ENABLED unset or 0)
      security:
      - bearer: []
  /readyz:
    get:
      tags:
      - routes
      summary: GET /readyz, /health — Readiness probe (no auth).
      description: Returns 200 if ready and Postgres is reachable, 503 otherwise.
      operationId: handle_readiness
      responses:
        '200':
          description: Ready and database reachable
        '503':
          description: Not ready or database unreachable
  /send:
    post:
      tags:
      - routes
      summary: POST /send — containers deliver outbound messages to Telegram.
      description: Authenticated via `require_bearer_token` middleware.
      operationId: handle_send
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPayload'
        required: true
      responses:
        '200':
          description: Message sent to Telegram
        '400':
          description: Invalid payload (empty or oversized text)
        '401':
          description: Missing or invalid Bearer token
        '410':
          description: Bot blocked by user
        '429':
          description: Telegram rate limit exceeded
        '502':
          description: Telegram API error
      security:
      - bearer: []
  /version:
    get:
      tags:
      - routes
      summary: GET /version — Build version and git hash (no auth).
      description: |-
        Returns build version from Cargo.toml and short git hash captured at compile
        time. Falls back to "unknown" for git_hash when .git is absent.
      operationId: handle_version
      responses:
        '200':
          description: Build version info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /webhook/telegram:
    post:
      tags:
      - routes
      summary: POST /webhook/telegram — receive Telegram updates.
      description: |-
        Validates the X-Telegram-Bot-Api-Secret-Token header using constant-time comparison.
        Returns 200 to Telegram immediately, then processes asynchronously.
        Request body is a Telegram Update JSON object (see Telegram Bot API docs).
      operationId: handle_webhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramUpdate'
        required: true
      responses:
        '200':
          description: Update accepted
        '401':
          description: Invalid webhook secret
        '503':
          description: At capacity, Telegram will retry
components:
  schemas:
    PhotoSize:
      type: object
      required:
      - file_id
      - file_unique_id
      - width
      - height
      properties:
        file_id:
          type: string
        file_size:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        file_unique_id:
          type: string
        height:
          type: integer
          format: int32
          minimum: 0
        width:
          type: integer
          format: int32
          minimum: 0
    PostMessagePayload:
      type: object
      description: Body of `POST /orchestrator/inbox/{orchestrator_id}/message`.
      required:
      - kind
      - body
      properties:
        body:
          description: |-
            Free-form JSON body. For `handoff`, mirrors the mika-platform#100
            filesystem-inbox entry shape.
        kind:
          type: string
          description: 'Message kind: `handoff`, `update`, or `ack`.'
          example: handoff
        spawn_id:
          type:
          - string
          - 'null'
          description: Spawn correlation id (null for orchestrator-originated messages — reserved for v2+).
    PostMessageResponse:
      type: object
      description: 'Response from POST: persisted row id (monotonic, used as SSE cursor).'
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          example: 42
    ReplyToMessage:
      type: object
      description: |-
        Replied-to message context for reply routing.
        Telegram sends the full original message; we capture `message_id` for DB lookup
        and `text` for parsing the `[agent_name]` prefix.
      required:
      - message_id
      properties:
        message_id:
          type: integer
          format: int64
        text:
          type:
          - string
          - 'null'
    SendPayload:
      type: object
      required:
      - chat_id
      - text
      properties:
        agent_name:
          type:
          - string
          - 'null'
          description: |-
            Agent name for identification in multi-agent setups.
            When present, outbound messages are prefixed with `[agent_name]`.
        chat_id:
          type: integer
          format: int64
        customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Customer ID for per-customer bot token lookup.
            When present, the gateway looks up the customer's bot token and sends
            via their bot. When absent, falls back to the global single-bot client.
        request_id:
          type:
          - string
          - 'null'
        text:
          type: string
    TelegramChat:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
    TelegramDocument:
      type: object
      required:
      - file_id
      - file_unique_id
      properties:
        file_id:
          type: string
        file_name:
          type:
          - string
          - 'null'
        file_size:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
        file_unique_id:
          type: string
        mime_type:
          type:
          - string
          - 'null'
    TelegramMessage:
      type: object
      required:
      - chat
      properties:
        caption:
          type:
          - string
          - 'null'
        chat:
          $ref: '#/components/schemas/TelegramChat'
        document:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TelegramDocument'
        photo:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PhotoSize'
        reply_to_message:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ReplyToMessage'
        text:
          type:
          - string
          - 'null'
    TelegramUpdate:
      type: object
      required:
      - update_id
      properties:
        message:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TelegramMessage'
        update_id:
          type: integer
          format: int64
    VersionInfo:
      type: object
      description: Build version info returned by the `/version` endpoint.
      required:
      - version
      - git_hash
      properties:
        git_hash:
          type: string
          description: Short git commit hash captured at compile time
          example: abc1234
        version:
          type: string
          description: Semantic version from Cargo.toml
          example: 0.4.0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Shared secret between gateway and agent containers (MIKA_INTERNAL_TOKEN)
