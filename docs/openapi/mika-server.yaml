openapi: 3.1.0
info:
  title: Mika Agent API (mika-server)
  description: Per-customer agent container HTTP API. Receives messages from the gateway, runs the agent loop, and delivers responses asynchronously.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - handlers
      summary: GET /health — Liveness/readiness probe (no auth required).
      operationId: handle_health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Server is starting up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /message:
    post:
      tags:
      - handlers
      summary: POST /message — gateway forwards a user message for async processing.
      description: |-
        Returns 202 Accepted immediately, then spawns the agent loop in background.
        Agent responses are delivered outbound via GatewayMessageSender.
      operationId: handle_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      responses:
        '202':
          description: Message accepted for async processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          description: Invalid request (empty text without images, oversized text, or unsupported image media_type)
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Agent not found
        '429':
          description: Agent is busy processing another message
      security:
      - bearer: []
  /api/v1/dashboard/enable:
    post:
      tags:
      - dashboard
      summary: POST /api/v1/dashboard/enable — Enable the embedded dashboard at runtime.
      operationId: handle_dashboard_enable
      responses:
        '200':
          description: Dashboard enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '401':
          description: Missing or invalid Bearer token
      security:
      - bearer: []
      - dashboard_bearer: []
  /api/v1/dashboard/disable:
    post:
      tags:
      - dashboard
      summary: POST /api/v1/dashboard/disable — Disable the embedded dashboard at runtime.
      operationId: handle_dashboard_disable
      responses:
        '200':
          description: Dashboard disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '401':
          description: Missing or invalid Bearer token
      security:
      - bearer: []
      - dashboard_bearer: []
  /api/v1/dashboard/status:
    get:
      tags:
      - dashboard
      summary: GET /api/v1/dashboard/status — Return current dashboard state.
      operationId: handle_dashboard_status
      responses:
        '200':
          description: Dashboard status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  has_assets:
                    type: boolean
                    description: Whether dashboard assets were embedded at compile time
                  has_token:
                    type: boolean
                    description: Whether MIKA_DASHBOARD_TOKEN is configured
        '401':
          description: Missing or invalid Bearer token
      security:
      - bearer: []
      - dashboard_bearer: []
components:
  schemas:
    AcceptedResponse:
      type: object
      description: Accepted response for async processing.
      required:
      - request_id
      - status
      properties:
        request_id:
          type: string
        status:
          type: string
    HealthResponse:
      type: object
      description: Health check response body.
      required:
      - status
      properties:
        status:
          type: string
        uptime_secs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ImagePayload:
      type: object
      description: Image payload forwarded from the gateway.
      required:
      - media_type
      - data
      properties:
        data:
          type: string
        media_type:
          type: string
    MessageRequest:
      type: object
      description: Inbound message from the gateway.
      required:
      - text
      - chat_id
      - channel
      - request_id
      properties:
        agent:
          type: string
          description: Target agent name (defaults to the server's default agent if absent).
        channel:
          type: string
        chat_id:
          type: integer
          format: int64
        images:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImagePayload'
          description: Optional images forwarded from the gateway (base64-encoded).
        request_id:
          type: string
        text:
          type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Shared secret between gateway and agent container (MIKA_INTERNAL_TOKEN)
    dashboard_bearer:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Read-only dashboard token (MIKA_DASHBOARD_TOKEN)
