openapi: 3.1.0
info:
  title: Mika Agent API (mika-server)
  description: Per-customer agent container HTTP API. Receives messages from the gateway, runs the agent loop, and delivers responses asynchronously.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - handlers
      summary: GET /health — Liveness/readiness probe (no auth required).
      operationId: handle_health
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Server is starting up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /message:
    post:
      tags:
      - handlers
      summary: POST /message — gateway forwards a user message for async processing.
      description: |-
        Returns 202 Accepted immediately, then spawns the agent loop in background.
        Agent responses are delivered outbound via GatewayMessageSender.
      operationId: handle_message
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      responses:
        '202':
          description: Message accepted for async processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
        '400':
          description: Invalid request (empty text without images, oversized text, or unsupported image media_type)
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Agent not found
        '429':
          description: Agent is busy processing another message
      security:
      - bearer: []
  /api/v1/team-runs/{run_id}/summary:
    get:
      tags:
      - dashboard
      summary: GET /api/v1/team-runs/:run_id/summary — team run summary with previous context data.
      description: |-
        Returns a structured summary of a team run including goal, agent result previews,
        deliverable, critic feedback, task statuses, and pending tasks. Used by the dashboard
        to render previous run context alongside current run data.
      operationId: handle_team_run_summary
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Team run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamRunSummary'
        '401':
          description: Missing or invalid Bearer token
        '404':
          description: Team run not found
        '500':
          description: Internal server error
      security:
      - bearer: []
components:
  schemas:
    AcceptedResponse:
      type: object
      description: Accepted response for async processing.
      required:
      - request_id
      - status
      properties:
        request_id:
          type: string
        status:
          type: string
    HealthResponse:
      type: object
      description: Health check response body.
      required:
      - status
      properties:
        status:
          type: string
        uptime_secs:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ImagePayload:
      type: object
      description: Image payload forwarded from the gateway.
      required:
      - media_type
      - data
      properties:
        data:
          type: string
        media_type:
          type: string
    MessageRequest:
      type: object
      description: Inbound message from the gateway.
      required:
      - text
      - chat_id
      - channel
      - request_id
      properties:
        agent:
          type: string
          description: Target agent name (defaults to the server's default agent if absent).
        channel:
          type: string
        chat_id:
          type: integer
          format: int64
        images:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ImagePayload'
          description: Optional images forwarded from the gateway (base64-encoded).
        request_id:
          type: string
        text:
          type: string
    TeamRunSummary:
      type: object
      description: Structured summary of a team run for context injection and dashboard display.
      required:
      - run
      - agent_results
      - task_statuses
      - pending_tasks
      properties:
        run:
          type: object
          description: The team run record.
          required:
          - id
          - team_name
          - status
          properties:
            id:
              type: string
            team_name:
              type: string
            goal:
              type: string
            status:
              type: string
            failure_reason:
              type: string
              nullable: true
            deliverable:
              type: string
              nullable: true
            iteration:
              type: integer
              nullable: true
            max_iterations:
              type: integer
            started_at:
              type: integer
              format: int64
            ended_at:
              type: integer
              format: int64
              nullable: true
        agent_results:
          type: array
          items:
            type: object
            required:
            - agent_name
            - response_preview
            properties:
              agent_name:
                type: string
              response_preview:
                type: string
        task_statuses:
          type: array
          items:
            type: object
            required:
            - agent_id
            - label
            - status
            - task_id
            properties:
              agent_id:
                type: string
              label:
                type: string
              status:
                type: string
              task_id:
                type: string
        pending_tasks:
          type: array
          items:
            type: object
            required:
            - agent_id
            - label
            - status
            - task_id
            properties:
              agent_id:
                type: string
              label:
                type: string
              status:
                type: string
              task_id:
                type: string
        critic_feedback:
          type: string
          nullable: true
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Shared secret between gateway and agent container (MIKA_INTERNAL_TOKEN)
