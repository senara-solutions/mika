name: Publish @samidarko/ui

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install -w packages/ui

      - name: Build
        run: npm run build -w packages/ui

      - name: Check if version changed
        id: version
        run: |
          PUBLISHED=$(npm view @samidarko/ui version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./packages/ui/package.json').version")
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish -w packages/ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish
        if: steps.version.outputs.skip != 'true'
        run: |
          EXPECTED=$(node -p "require('./packages/ui/package.json').version")
          # npmjs.org can lag a few seconds after publish; retry before failing.
          for attempt in 1 2 3 4 5; do
            PUBLISHED=$(npm view @samidarko/ui version 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$EXPECTED" ]; then
              echo "Verified @samidarko/ui@$PUBLISHED is live on the public registry."
              exit 0
            fi
            echo "Attempt $attempt: registry reports '$PUBLISHED', expected '$EXPECTED' — retrying in 15s."
            sleep 15
          done
          echo "::error::Post-publish verification failed: @samidarko/ui@$EXPECTED not visible on the default registry."
          exit 1
