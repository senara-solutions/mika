name: Publish @samidarko/ui

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install -w packages/ui

      - name: Build
        run: npm run build -w packages/ui

      - name: Check if version changed
        id: version
        run: |
          PUBLISHED=$(npm view @samidarko/ui version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./packages/ui/package.json').version")
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish -w packages/ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # La logique vit dans scripts/verify-npm-publish.sh, exercée hors réseau
      # par scripts/test-verify-npm-publish.sh et armée en CI par le job
      # `publish-verify-lint`. Elle N'EST PLUS ICI, et c'est le livrable.
      #
      # HISTORIQUE — conservé et daté, parce qu'il dit pourquoi ce n'est pas le
      # nombre d'essais qui a changé :
      #
      #   2026-07, mika#1917 (`d32a0fd7`, run 32160868980). L'étape publish a
      #   réussi (@samidarko/ui@0.3.1 live), la vérification a couru ~2 s après
      #   la publication et ses 5 essais ont tous rendu du vide. Le correctif fut
      #   la boucle 5×15 s, posée sur une borne supposée — « npmjs CDN can take
      #   up to ~60s » — jamais mesurée.
      #
      #   2026-09-28, mika#2566 (run 36410711981). Bump 0.3.1 → 0.4.0. Les cinq
      #   essais ont échoué, le run est sorti rouge, et `npm view` rendait
      #   `0.4.0` quelques minutes plus tard. LA BOUCLE 5×15 s ÉTAIT LE
      #   CORRECTIF DE mika#1917 ; mika#2566 est sa deuxième occurrence, et le
      #   remède que le ticket proposait — rallonger — est celui qui avait déjà
      #   échoué.
      #
      # D'où le déplacement : une boucle enfouie dans un `run:` n'est exercée par
      # rien, donc son insuffisance ne se découvre qu'au bump suivant, sur `main`,
      # en rouge. Le suivant sera vérifié avant de partir.
      #
      # La requête reste versionnée (`<pkg>@<version>`) et non « latest » : elle
      # reste sans ambiguïté même si une publication concurrente a posé un tag
      # plus récent.
      - name: Verify publish (mika#2566 — fenêtre bornée, cause diagnostiquée)
        if: steps.version.outputs.skip != 'true'
        run: |
          bash scripts/verify-npm-publish.sh @samidarko/ui \
            "$(node -p "require('./packages/ui/package.json').version")"
