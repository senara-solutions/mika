name: Publish @samidarko/ui

on:
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install -w packages/ui

      - name: Build
        run: npm run build -w packages/ui

      - name: Check if version changed
        id: version
        run: |
          PUBLISHED=$(npm view @samidarko/ui version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./packages/ui/package.json').version")
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish -w packages/ui --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publish (with CDN-propagation retry)
        if: steps.version.outputs.skip != 'true'
        run: |
          EXPECTED=$(node -p "require('./packages/ui/package.json').version")
          # npmjs CDN can take up to ~60s to propagate a new publish. Retry with
          # backoff to avoid false-negative failures on successful publishes.
          # See mika#1917 run 32160868980 — publish step succeeded (@samidarko/ui@0.3.1
          # live), verify raced ~2s post-publish, all 5×15s attempts returned empty
          # before propagation completed.
          # Version-specific query (@pkg@$EXPECTED version) targets the exact version
          # under test rather than "latest", making the assertion unambiguous even
          # if a concurrent publish landed a newer tag.
          MAX_ATTEMPTS=5
          SLEEP_SECS=15
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            PUBLISHED=$(npm view @samidarko/ui@$EXPECTED version 2>/dev/null || echo "")
            if [ "$PUBLISHED" = "$EXPECTED" ]; then
              echo "Verified @samidarko/ui@$PUBLISHED is live on the public registry (attempt $attempt/$MAX_ATTEMPTS)."
              exit 0
            fi
            echo "Attempt $attempt/$MAX_ATTEMPTS: @samidarko/ui@$EXPECTED not yet visible. Sleeping ${SLEEP_SECS}s..."
            sleep $SLEEP_SECS
          done
          echo "::error::Post-publish verification failed after $MAX_ATTEMPTS attempts: @samidarko/ui@$EXPECTED not visible on the default registry."
          exit 1
