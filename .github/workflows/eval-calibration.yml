name: Eval Calibration

# LE `schedule` A ÉTÉ RETIRÉ — mika#2683, volet (b), décision de grooming D2.
#
# Ce workflow a échoué 17 fois sur 17 du 2026-06-22 au 2026-10-12 : la commande
# cargo portait `--ignored` ET `--include-ignored`, mutuellement exclusifs, et
# le `|| true` avalait l'erreur. Il n'a donc JAMAIS produit d'artefact, et
# chaque lundi son échec sur `main` coûtait un tour LLM à mika-dev.
#
# Corriger le flag seul (ci-dessous) ferait passer ce cron de « échoue avant
# tout appel » à « appelle quatre vrais fournisseurs chaque lundi » : l'étape
# exporte `MIKA_EVAL_REAL_PROVIDERS: all` et quatre clés. Coût mesuré
# ~2,57 $/exécution, ~150 $/an. C'est une dépense récurrente, donc une décision
# d'opérateur — et une session dispatchée qui pose une question est une session
# morte. Le `schedule` part ; le flag est corrigé quand même, pour que la
# correction soit acquise et vérifiable par `workflow_dispatch`.
#
# RÉARMEMENT : décision de budget consignée sur mika#2683, puis réintroduire
#
#   schedule:
#     - cron: '0 8 * * 1'   # lundis 08:00 UTC (09:00 Paris)
#
# Trois lignes de YAML, aucune autre condition. Tant qu'il n'est pas réarmé, la
# détection de dérive de tolérance des fournisseurs (#742) est à la demande.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write
  pull-requests: write

jobs:
  calibrate:
    name: Calibrate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          prefix-key: v1-rust

      - name: Create dashboard dist placeholder
        run: mkdir -p dashboard/dist

      - name: Build eval-diff
        run: cargo build --bin eval-diff --release

      - name: Run calibration matrix
        id: calibrate
        env:
          MIKA_EVAL_REAL_PROVIDERS: all
          MIKA_EVAL_CALIBRATE: "1"
          MIKA_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MIKA_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MIKA_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MIKA_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Log which providers have keys configured (without revealing values)
          for provider in ANTHROPIC OPENAI OPENROUTER GROQ; do
            var="MIKA_${provider}_API_KEY"
            if [ -n "${!var}" ]; then
              echo "✓ ${provider} key configured"
            else
              echo "⚠ ${provider} key NOT configured — provider will be skipped"
            fi
          done

          # Run the calibration test suite.
          #
          # `--ignored` SEUL (mika#2683) : l'intention de #742 est la matrice de
          # calibration, qui est précisément ce que `#[ignore]` marque. Ajouter
          # `--include-ignored` ferait tourner en plus toute la suite eval
          # bouchonnée, que `ci.yml` couvre déjà à chaque PR — et les deux flags
          # ensemble sont refusés par libtest.
          #
          # Pas de `|| true` : c'est lui qui a rendu 17 échecs illisibles. Un
          # échec de cargo doit faire échouer l'étape.
          #
          # L'eval KG (#762) est gardée séparément derrière
          # `MIKA_EVAL_KG_PROVIDERS`, que cette étape n'exporte pas :
          # `parse_kg_providers` rend un vecteur vide et ses quatre tests
          # s'auto-sautent. Aucun filtre de nom n'est donc nécessaire ici.
          cargo test -p mika-agent --test eval -- --ignored 2>&1

          # Find the latest calibration artifact
          ARTIFACT=$(ls -t target/eval-calibration/*.json 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "::error::No calibration artifact produced. Check test output above."
            exit 1
          fi

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Calibration artifact: $ARTIFACT"

      - name: Check for baseline
        id: baseline
        run: |
          if [ -f "tests/fixtures/eval-baseline.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap baseline (first run)
        if: steps.baseline.outputs.exists == 'false'
        run: |
          ./target/release/eval-diff bootstrap "${{ steps.calibrate.outputs.artifact }}"
          echo "DRIFT_MODE=bootstrap" >> "$GITHUB_ENV"

      - name: Diff against baseline
        if: steps.baseline.outputs.exists == 'true'
        id: diff
        run: |
          set +e
          ./target/release/eval-diff diff tests/fixtures/eval-baseline.json "${{ steps.calibrate.outputs.artifact }}"
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No drift detected. Baseline is current."
            echo "DRIFT_MODE=none" >> "$GITHUB_ENV"
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "Drift detected. Updating baseline."
            cp "${{ steps.calibrate.outputs.artifact }}" tests/fixtures/eval-baseline.json
            echo "DRIFT_MODE=drift" >> "$GITHUB_ENV"
          else
            echo "::error::eval-diff failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Generate PR body
        if: env.DRIFT_MODE == 'drift'
        id: pr-body
        run: |
          # Generate PR body from format-pr-body (title on line 1, body after blank line)
          OUTPUT=$(./target/release/eval-diff format-pr-body tests/fixtures/eval-baseline.json "${{ steps.calibrate.outputs.artifact }}" 2>&1 || true)
          TITLE=$(echo "$OUTPUT" | head -1)
          BODY=$(echo "$OUTPUT" | tail -n +3)

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          # Write body to file for multi-line support
          echo "$BODY" > /tmp/pr-body.md
          echo "" >> /tmp/pr-body.md
          echo "---" >> /tmp/pr-body.md
          echo "*Auto-generated by [eval-calibration workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*" >> /tmp/pr-body.md

      - name: Create drift PR
        if: env.DRIFT_MODE == 'drift' || env.DRIFT_MODE == 'bootstrap'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="eval-calibration/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/fixtures/eval-baseline.json
          git commit -m "eval-calibration: update baseline $(date -u +%Y-%m-%d)"
          git push origin "$BRANCH" --force

          if [ "$DRIFT_MODE" = "bootstrap" ]; then
            TITLE="eval-calibration: initial baseline bootstrap"
            BODY="## Eval Calibration Bootstrap

          First-run calibration baseline. This establishes the committed reference at \`tests/fixtures/eval-baseline.json\`.

          ## Review checklist
          - [ ] Scenario outcomes look reasonable for each provider
          - [ ] No unexpected errors or skipped providers
          - [ ] Merge to establish the baseline; future runs will diff against this

          ---
          *Auto-generated by [eval-calibration workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*"

            LABELS="eval-calibration,calibration-bootstrap"
          else
            TITLE="${{ steps.pr-body.outputs.title }}"
            BODY=$(cat /tmp/pr-body.md)
            LABELS="eval-calibration,drift-detected"
          fi

          # Check for existing open PR on same branch
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING"
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          else
            gh pr create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABELS"
          fi
