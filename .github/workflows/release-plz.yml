name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'senara-solutions'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@90b40388b8931b1c39e248959515e295e02e9066  # v2
        with:
          tool: git-cliff

      - name: Check for unreleased changes
        id: check
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, skipping"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FEAT_COUNT=$(git log "${LATEST_TAG}..HEAD" --oneline --no-merges --grep="^feat" | wc -l)
          FIX_COUNT=$(git log "${LATEST_TAG}..HEAD" --oneline --no-merges --grep="^fix" | wc -l)
          REFACTOR_COUNT=$(git log "${LATEST_TAG}..HEAD" --oneline --no-merges --grep="^refactor" | wc -l)
          PERF_COUNT=$(git log "${LATEST_TAG}..HEAD" --oneline --no-merges --grep="^perf" | wc -l)
          DOC_COUNT=$(git log "${LATEST_TAG}..HEAD" --oneline --no-merges --grep="^doc" | wc -l)
          TOTAL=$((FEAT_COUNT + FIX_COUNT + REFACTOR_COUNT + PERF_COUNT + DOC_COUNT))

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "feat_count=$FEAT_COUNT" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine next version
        if: steps.check.outputs.has_changes == 'true'
        id: version
        run: |
          CURRENT="${{ steps.check.outputs.latest_tag }}"
          CURRENT="${CURRENT#v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BREAKING=$(git log "v${CURRENT}..HEAD" --oneline --no-merges --grep="BREAKING" | wc -l)

          if [ "$BREAKING" -gt 0 ] && [ "$MAJOR" -gt 0 ]; then
            NEXT="$((MAJOR + 1)).0.0"
          elif [ "${{ steps.check.outputs.feat_count }}" -gt 0 ]; then
            NEXT="${MAJOR}.$((MINOR + 1)).0"
          else
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create or update release branch and PR
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          CURRENT="${{ steps.version.outputs.current }}"
          BRANCH="release/v${NEXT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Recreate the release branch from main HEAD on every run. The branch is tool-owned
          # and has no history worth preserving — every commit is regenerated from
          # main + version bump + git-cliff output. Approach 3 (Class C resolution) in
          # docs/solutions/ci-cd/release-automation-chronic-drift-2026-04-23.md.
          git checkout -B "$BRANCH" main

          # Bump workspace version
          sed -i "s/^version = \"${CURRENT}\"/version = \"${NEXT}\"/" Cargo.toml

          # Update Cargo.lock
          cargo update --workspace

          # Generate changelog
          git-cliff --tag "v${NEXT}" -o CHANGELOG.md

          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: release v${NEXT}"

          # Force-push: any prior state on origin (orphan from a failed run, or a stale branch
          # from a closed-without-merge PR) is replaced with the deterministic regeneration.
          git push --force origin "$BRANCH"

          # Open a PR only if one isn't already open. An existing open PR auto-tracks the
          # force-pushed branch tip, so no separate "update" step is needed.
          EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Release PR #$EXISTING_PR already open — branch updated via force-push"
          else
            CHANGELOG_BODY=$(git-cliff --tag "v${NEXT}" --unreleased --strip header)
            gh pr create \
              --title "chore: release v${NEXT}" \
              --body "## Release v${NEXT}
          ${CHANGELOG_BODY}

          ---
          Merging this PR will trigger tag creation and GitHub release." \
              --label "release" \
              --base main \
              --head "$BRANCH"
          fi

  release-tag:
    name: Tag & Release
    runs-on: ubuntu-22.04
    if: >-
      github.repository_owner == 'senara-solutions' &&
      startsWith(github.event.head_commit.message, 'chore: release v')
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@90b40388b8931b1c39e248959515e295e02e9066  # v2
        with:
          tool: git-cliff

      - name: Extract version and create tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          git config user.name "mika-platform[bot]"
          git config user.email "mika@getmika.ai"

          VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'v\d+\.\d+\.\d+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "No version found in commit message, skipping"
            exit 0
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping"
            exit 0
          fi

          NOTES=$(git-cliff --tag "$VERSION" --unreleased --strip header 2>/dev/null || echo "Release $VERSION")

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --verify-tag
