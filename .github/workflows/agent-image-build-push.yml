# Auto-build + ECR-push of the mika-agent image on merge to main (mika#1619).
#
# Before this workflow, every customer-side fix reaching the cluster required a
# manual operator "ascension": docker build -> ECR login -> docker push -> helm
# values bump. That gated every rollout on operator hands and let mika main drift
# from what the agent pods actually ran. This job automates the build+push half;
# the downstream tag-rotation PR on mika-cloud/helm values.yaml stays a separate,
# out-of-scope concern (a 1-line bump that reads the tag emitted below).
#
# Auth: OIDC-federated role-assume, no long-lived AWS creds — same id-token
# mechanism release.yml already uses for build provenance. The single required
# repo secret is ECR_PUSH_ROLE_ARN (the ARN of the ECR-push role whose trust
# policy allows this repo's GitHub OIDC subject; provisioned in mika-cloud
# Terraform per mika#1619). No AWS access keys are stored.
#
# Tags pushed: two, and each one is a function of the commit.
#   - <full github.sha>       the 40-char sha; provenance, pinnable forever
#   - main-<first 8 of sha>   the form the downstream rotation actually consumes
#
# The second tag is not a convenience, it is the whole point of pushing at all
# (mika#2174). Measured on mika-cloud 2026-09-04: every deployed `image.tag` and
# every tag in the ECR history is of the form `main-<short>` — `main-7cea6d6`,
# `main-960ab824`, `main-56336b9e`, `main-d7314906` — while nothing anywhere
# reads the bare 40-char form (`grep -rn -E 'github\.sha|GITHUB_SHA|[0-9a-f]{40}'`
# over mika-cloud's helm/ and scripts/ returns zero lines; rotate-image.sh
# derives no tag at all, it writes the literal it is handed). A workflow that
# pushed only the bare sha would not fail — it would produce an artifact nobody
# downstream can deploy without a manual translation.
#
# There is still deliberately NO moving convenience tag, and that is not in
# tension with pushing two tags. What mika#2143 forbids is a tag that gets
# REASSIGNED from one build to the next, not a second tag: both tags above are
# functions of the commit sha, so two distinct commits can never produce the
# same tag and no push can ever reassign one. The three ECR repositories —
# mika-agent, mika-gateway, mika-console — are declared IMMUTABLE and refuse to
# reassign a tag they already carry, so `latest`, `stable` or a bare `main`
# would fail on the first run that gets past authentication. The immutability
# is the guarantee of provenance — a deployed tag always designates the content
# it was created with — and it is not traded away for a naming convenience.
#
# A third tag is therefore allowed if and only if it is a function of the sha.
# scripts/check-image-tags-immutable.sh fails the build otherwise — including
# when a tag hides its non-derivation behind a variable, since the guard
# resolves `${{ env.X }}` against this file's own assignments and refuses what
# it cannot prove.
#
# `main-<short8>` has to travel through the SHORT_SHA step below because
# GitHub's expression language has no substring function. Eight characters is
# the ask of mika#2174; the 7-char tags already in the ECR history stay
# consumable, since the rotation takes a literal tag argument, not a length.
#
# A consumer that wants "the newest build" resolves it instead of reading a
# moving tag: `aws ecr describe-images --repository-name mika-agent` sorted on
# `imagePushedAt` — which is what the cloud freshness probe already does.
name: Agent Image Build & Push

on:
  push:
    branches: [main]
    # Only rebuild+push when something that actually goes into the agent image
    # changes — mirrors ci.yml's `images-relevant` paths-filter so docs-only or
    # unrelated merges don't spend an ECR push. Keep in sync with Dockerfile.agent
    # COPY inputs and with the CI filter.
    paths:
      - 'Dockerfile.agent'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'skills/**'
      - 'packages/**'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-image-build-push.yml'

# OIDC needs id-token: write; contents: read for checkout. Nothing else.
permissions:
  contents: read
  id-token: write

# One in-flight build per ref. Do NOT cancel a mid-push run: a build killed
# part-way through `docker push` leaves partially transferred layers behind and
# poisons the gha cache scope shared with ci.yml's PR-side docker-build, so the
# next run pays a full rebuild. The directive below stays — it guards a defect
# distinct from the tag-immutability one (mika#2143), and the two must not be
# conflated.
concurrency:
  group: agent-image-build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  ECR_REGISTRY: 043025085284.dkr.ecr.eu-west-3.amazonaws.com
  ECR_REPOSITORY: mika-agent

jobs:
  build-push:
    name: Build & push mika-agent to ECR
    runs-on: ubuntu-22.04
    # Never run on a fork: the OIDC role trusts only the canonical repo, and a
    # fork has no business pushing production artifacts. Matches release.yml.
    if: github.repository_owner == 'senara-solutions'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      # Fail loudly and early with a human-readable reason if the deploy role is
      # not configured, instead of a cryptic AssumeRoleWithWebIdentity error.
      - name: Verify ECR push role is configured
        env:
          ECR_PUSH_ROLE_ARN: ${{ secrets.ECR_PUSH_ROLE_ARN }}
        run: |
          if [ -z "$ECR_PUSH_ROLE_ARN" ]; then
            echo "::error::Secret ECR_PUSH_ROLE_ARN is not set. Provision the OIDC ECR-push role (mika-cloud Terraform, mika#1619) and add its ARN as the repo secret ECR_PUSH_ROLE_ARN."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c  # v6.2.4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          role-session-name: mika-agent-image-push-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3

      # The rotation consumes `main-<short8>`, and GitHub's expression language
      # has no substring function — so the short form cannot be written inline
      # in `tags:` and travels through this variable instead. The immutability
      # guard resolves that indirection against this assignment rather than
      # trusting the variable's name (mika#2174).
      - name: Derive the short sha
        run: echo "SHORT_SHA=${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"

      - name: Build and push mika-agent image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:main-${{ env.SHORT_SHA }}
          # Share the same gha cache scope as ci.yml's PR-side docker-build so the
          # merge build reuses layers already warmed during PR validation.
          cache-from: type=gha,scope=mika-agent
          cache-to: type=gha,scope=mika-agent,mode=max
          platforms: linux/amd64

      # Emit the pushed tags so a downstream reconciler / rotation PR can pin one
      # without re-deriving it (ticket: "Outputs the new tag to a workflow summary").
      # The rotation row is the one an operator copies into a helm values file;
      # it is printed from ${SHORT_SHA} rather than re-sliced here, so the summary
      # cannot drift from the tag that was actually pushed.
      - name: Publish pushed tags to workflow summary
        run: |
          {
            echo "### mika-agent image pushed to ECR"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| registry | \`${ECR_REGISTRY}\` |"
            echo "| repository | \`${ECR_REPOSITORY}\` |"
            echo "| immutable tag (full sha) | \`${GITHUB_SHA}\` |"
            echo "| rotation tag (the form helm values consume) | \`main-${SHORT_SHA}\` |"
            echo "| full ref | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}\` |"
            echo "| full ref (rotation) | \`${ECR_REGISTRY}/${ECR_REPOSITORY}:main-${SHORT_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
