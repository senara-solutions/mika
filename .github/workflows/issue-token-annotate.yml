name: Issue Token Annotation

# Surface S3 of mika#2201 — issue bodies.
#
# ─────────────────────────────────────────────────────────────────────────────
# NON-BLOCKING BY CONSTRUCTION, NOT BY CAUTION.
#
# AC1 asks for a lint that "refuses" non-canonical machine tokens in callouts
# and ISSUE BODIES. GitHub offers no gate on an issue: an `issues:` workflow can
# annotate, never refuse. Shipping this as a "gate" would announce a protection
# that does not exist — so it is an annotation, and the difference is written
# here rather than discovered by whoever trusts it.
#
# The canonical producer on the autonomous path is ALREADY a machine:
# `_write_canonical_callout` (dispatch-lib.sh) composes the three forms from a
# closed `case`. The remaining margin of error is the operator path, which
# deserves a signal, not a refusal nobody can render.
#
# ─────────────────────────────────────────────────────────────────────────────
# BOUNDED BY AN EPOCH.
#
# Prime's bearing forbids retroactive migration of prose ("pure cost against
# zero benefit"), so this fires on `opened` / `edited` ONLY — i.e. from its
# deployment onward, never on history. An issue nobody touches is never
# annotated, which is the intent.
#
# A COMMENT, NOT A LABEL. An enforcement label undeclared in `.github/labels.yml`
# is deleted by label-sync (`delete-other-labels: true`) from the repo and from
# every issue carrying it, with no event and no log — the class this very lint
# found a fifth occurrence of while being written (`needs-multi-agent-review`).
# Declaring one just to carry an annotation would add a thing to maintain for a
# signal a comment already carries.
#
# ONE COMMENT PER BODY STATE. The workflow rewrites its own previous comment
# instead of stacking a new one on every edit: an annotation that accumulates is
# an annotation people mute, which is § R4 on a surface that has no gate to
# lose.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE REWRITE TARGETS THE COMMENT, NEVER THE ISSUE (mika#2552).
#
# That rewrite used to resolve its target by string surgery on an HTML url, which
# yielded `https://api.github.com/repos/O/R/issues/N#issuecomment-ID`. The
# fragment is not transmitted over HTTP, so the effective target was
# `PATCH /repos/O/R/issues/N` — the ISSUE-edit route — and `-f body=` replaced the
# issue body with the annotation. The target was never malformed; it was VALID AND
# DESIGNATED SOMETHING ELSE. A `>/dev/null 2>&1 || true` made it emit nothing.
# Measured on mika#2544: a 3934-byte groomed body reduced to 979 bytes, its
# `Branch` / `Plan` / `Grooming history` callouts gone, after which
# `check_grooming_markers` returned `MarkersMissing` and the engine routed a
# second groom instead of the implement.
#
# `issues: write` is NECESSARY for `gh issue comment` and GitHub offers no
# "comment without editing the body" granularity, so no version of this workflow
# can annotate without being able to destroy. What bounds it is therefore A
# PREDICATE ON THE TARGET, never a privilege reduction — and it lives in
# `scripts/annotate-issue-token-comment.sh`, because a predicate inside a `run:`
# block is testable by nothing. The PATCH is no longer silenced either: a refused
# target reddens the Actions tab, which is the only instrument this surface has.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS DOES NOT BUY, said plainly: its SILENCE PROVES NOTHING. An
# annotation nobody reads is a silence with one more line in it. The only
# measure this ticket offers is the accusation rate on S1 + S2, where a gate
# exists.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  annotate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Lint the issue body for non-canonical machine tokens
        id: lint
        run: |
          gh issue view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --json body --jq .body > /tmp/issue-body.md
          if bash scripts/check-canonical-tokens.sh --body /tmp/issue-body.md > /tmp/lint-out.txt 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The comment names the token, its canonical form and the match site that
      # will not see it — the three things an author needs in order to fix it
      # without opening the lint.
      #
      # The logic lives in a script, not here: the PATCH target's guard (mika#2552)
      # has to be exhaustively testable, and no harness in this repo can execute a
      # workflow step. The script is neither silenced nor `|| true`-d — a refused
      # target reddens this job on purpose.
      - name: Annotate, or withdraw a previous annotation
        run: |
          bash scripts/annotate-issue-token-comment.sh \
            "${{ github.repository }}" \
            "${{ github.event.issue.number }}" \
            "${{ steps.lint.outputs.clean }}" \
            /tmp/lint-out.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
