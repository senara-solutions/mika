# DÉSACTIVÉ le 2026-08-29 — ce workflow ne se déclenche plus sur `push: main`.
#
# POURQUOI. Il échouait à CHAQUE merge : 300 runs relevés entre le 2026-06-05 et
# le 2026-08-29, 300 en échec, aucun succès. `main` était donc rouge en
# permanence, et un `main` durablement rouge apprend à ignorer le rouge — le
# signal était devenu un coût, pas une alerte.
#
# Aucun consommateur connu de ce canal de publication : dernière étiquette
# `v0.12.2` du 2026-05-09, et le déploiement se fait depuis `main` via
# `make deploy`. Les assets gardent des téléchargements résiduels (38 sur
# v0.12.2, 132 toutes releases confondues) et `install.sh` tire bien depuis
# GitHub Releases — mais ce workflow ne produit plus rien depuis le 2026-05-09,
# donc l'éteindre ne retire à personne ce qu'il n'obtenait déjà plus.
#
# LA CAUSE, EXACTEMENT. Ce n'est PAS un défaut de configuration manifest.
# release-please v4 retombe sur ses fichiers par défaut quand `config-file` et
# `manifest-file` sont vides, et le log du run 33245981885 le montre :
#
#     ❯ Fetching release-please-config.json from branch main
#     ❯ Fetching .release-please-manifest.json from branch main
#     ✔ Building candidate release pull request for path: .
#     ❯ type: rust
#
# La config était donc bien lue. Ce n'est pas non plus les commits non
# parsables : 3 sont sautés et le run continue (`Considering: 1190 commits`).
#
# La cause fatale est la stratégie `rust` face à notre workspace virtuel :
#
#     ⚠ member crates/* declared but did not find Cargo.toml
#       → le glob de `members` n'est pas développé, aucun membre résolu
#     ✖ is not a package manifest (might be a cargo workspace)
#       → le Cargo.toml racine n'a pas de section [package], exception fatale
#
# CE QUI RESTE. `workflow_dispatch` est conservé DÉLIBÉRÉMENT, comme point
# d'entrée manuel pour la reprise. ATTENTION, ce n'est PAS un bac à sable :
# l'action est invoquée sans `target-branch` (voir le job ci-dessous), donc elle
# cible la branche par défaut quel que soit le `ref` choisi au dispatch — un
# dispatch créerait une vraie PR de release sur `main`. mika#2048 doit ajouter
# `target-branch` AVANT de s'en servir pour vérifier quoi que ce soit.
#
# Le job `update-lockfile` est laissé intact : il ne peut pas devenir orphelin
# (`needs:` le marque *skipped*, jamais *failed*) et il encode du contexte dont
# la reprise a besoin.
#
# POUR RALLUMER. mika#2048 énonce la condition (quelqu'un consomme-t-il les
# releases ?) et les étapes. Diagnostic complet : mika#2047.

name: Release (disabled — see mika#2048)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.repository_owner == 'senara-solutions'
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # release-please does NOT run `cargo update --workspace` — its CargoLock updater
  # does string replacement only. This job regenerates Cargo.lock on the release PR
  # branch after release-please creates/updates it.
  update-lockfile:
    name: Update Cargo.lock
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: release-please
    # GitHub Actions outputs are always strings — prs_created is 'true'/'false', not boolean.
    # prs_created == 'true': a new PR was just created. pr != '': an existing PR was updated.
    if: needs.release-please.outputs.prs_created == 'true' || needs.release-please.outputs.pr != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Branch name format: release-please--branches--<base>--components--<component>
          # Derived from component "mika" in release-please-config.json + target branch "main".
          ref: release-please--branches--main--components--mika
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Regenerate Cargo.lock
        run: |
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: regenerate Cargo.lock after version bump"
            git push
          fi
