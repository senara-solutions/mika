# Release PR automation (release-please v4, manifest mode).
#
# RALLUMÉ le 2026-08-30 par mika#2048 (reprise de mika#2047). Il était éteint
# parce que la stratégie `rust` échoue sur notre workspace virtuel : elle tente
# de lire le `Cargo.toml` racine comme un manifeste de paquet (`✖ is not a
# package manifest`) et de développer le glob `members = ["crates/*"]`, ce que
# notre racine sans section [package] ne permet pas.
#
# LE FIX (release-please-config.json) : `release-type: "simple"` sur le paquet
# `"."` au lieu de `"rust"`. La stratégie `simple` ne parse aucun manifeste de
# paquet ; la version du workspace est propagée par l'`extra-files` toml générique
# (`jsonpath: $.workspace.package.version`), qui navigue l'arbre TOML sans exiger
# de section [package]. `simple` gère aussi un fichier `version.txt` à la racine
# (ancre de version de l'action). Le tag et le nom de branche restent inchangés
# (component "mika", include-component-in-tag: false) — le job `update-lockfile`
# ci-dessous garde donc sa `ref` valide.
#
# Cargo.lock : la stratégie `simple` ne touche pas au lockfile ; le job
# `update-lockfile` le régénère via `cargo update --workspace` après coup.
#
# Validé par un dry-run local (`release-please release-pr --dry-run`) contre
# `main` : plus d'exception fatale, PR de release candidate construite. Voir
# mika#2048.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.repository_owner == 'senara-solutions'
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # release-please does NOT run `cargo update --workspace` — its CargoLock updater
  # does string replacement only. This job regenerates Cargo.lock on the release PR
  # branch after release-please creates/updates it.
  update-lockfile:
    name: Update Cargo.lock
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: release-please
    # GitHub Actions outputs are always strings — prs_created is 'true'/'false', not boolean.
    # prs_created == 'true': a new PR was just created. pr != '': an existing PR was updated.
    if: needs.release-please.outputs.prs_created == 'true' || needs.release-please.outputs.pr != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Branch name format: release-please--branches--<base>--components--<component>
          # Derived from component "mika" in release-please-config.json + target branch "main".
          ref: release-please--branches--main--components--mika
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Regenerate Cargo.lock
        run: |
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: regenerate Cargo.lock after version bump"
            git push
          fi
