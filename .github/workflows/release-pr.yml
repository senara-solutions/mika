name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.repository_owner == 'senara-solutions'
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # release-please does NOT run `cargo update --workspace` — its CargoLock updater
  # does string replacement only. This job regenerates Cargo.lock on the release PR
  # branch after release-please creates/updates it.
  update-lockfile:
    name: Update Cargo.lock
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: release-please
    # GitHub Actions outputs are always strings — prs_created is 'true'/'false', not boolean.
    # prs_created == 'true': a new PR was just created. pr != '': an existing PR was updated.
    if: needs.release-please.outputs.prs_created == 'true' || needs.release-please.outputs.pr != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # Branch name format: release-please--branches--<base>--components--<component>
          # Derived from component "mika" in release-please-config.json + target branch "main".
          ref: release-please--branches--main--components--mika
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Regenerate Cargo.lock
        run: |
          cargo update --workspace
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: regenerate Cargo.lock after version bump"
            git push
          fi
