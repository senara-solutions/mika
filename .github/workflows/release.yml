# Release binaries — the release path of mika#2890. Operator steps: docs/releasing.md.
#
# TWO ENTRIES, ONE PIPELINE.
#   push of a tag vX.Y.Z or vX.Y.Z-rc.N  -> builds, signs, then PUBLISHES a release
#   workflow_dispatch from main          -> builds and signs the same files as a
#                                           workflow artifact; publishes nothing
#
# Every job before `publish` writes workflow artifacts only. `publish` creates the
# release as a draft with every file attached and only then makes it public, so no
# release is ever visible half-uploaded.
#
# A CANDIDATE IS NEVER "LATEST". install.sh installs `releases/latest`, and GitHub
# keeps a release out of it only when it is a prerelease. scripts/release-tag.sh
# classifies the tag (held offline by scripts/test-release-tag.sh); `publish`
# passes `--prerelease --latest=false` for -rc.N, checks the flag on the draft
# before making it public, re-reads `releases/latest` afterwards, and puts the
# release back to draft if GitHub disagrees.
#
# WHY THE PREVIOUS VERSION NEVER PUBLISHED ANYTHING (measured 2026-10-23):
#   - runs v0.12.0/v0.12.1/v0.12.2 ended `cancelled`: the x86_64-apple-darwin job
#     ran on `macos-13`, never got a runner, and hit "The job has exceeded the
#     maximum execution time while awaiting a runner for 24h0m0s". That target is
#     now cross-compiled on macos-14, the runner aarch64-apple-darwin already used.
#   - taiki-e/upload-rust-binary-action only runs `gh release upload`: the release
#     itself came from release-please, gone since mika#2047.
#   - the action names the checksum `<archive>.sha256`; install.sh and
#     docs/release-verification.md fetch `<archive>.tar.gz.sha256` (install.sh
#     against v0.12.2: 404, then "Checksum mismatch! Expected , got 4a16…").
#   - cargo-cyclonedx 0.5 writes `<package>.cdx.json`; the old sbom job copied
#     `crates/*/bom.json`, which matches nothing.

name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to name the files with, e.g. v1.0.0-rc.1. Nothing is published."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Two runs on the same tag would delete each other's draft in `publish`.
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    if: github.repository_owner == 'senara-solutions'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      base: ${{ steps.tag.outputs.base }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          # A tag push checks out one commit at depth 1, with no origin/main to
          # test ancestry against.
          fetch-depth: 0

      - name: Classify the tag and check it against main
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
            publish=true
          else
            # A manual run signs and attests what it builds, and the user
            # procedure accepts any ref of this workflow: only main may do that.
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::a manual run must start from main, not $REF"
              exit 1
            fi
            tag="$INPUT_TAG"
            publish=false
          fi

          bash scripts/release-tag.sh "$tag" Cargo.toml > classification
          cat classification
          base="$(sed -n 's/^base=//p' classification)"

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi

          if [ ! -f "docs/releases/v$base.md" ]; then
            echo "::error::release notes docs/releases/v$base.md are missing"
            exit 1
          fi

          {
            cat classification
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          # Cross-compiled from arm64: `macos-13` never got a runner (see header).
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install Rust toolchain
        run: |
          rustup show  # reads rust-toolchain.toml
          rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          prefix-key: v1-release
          key: ${{ matrix.target }}

      - name: Setup cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8  # v1
        with:
          target: ${{ matrix.target }}

      # Dashboard assets are not embedded in release builds (empty placeholder);
      # the /dashboard/ endpoint shows a branded "disabled" page.
      - name: Create dashboard dist placeholder
        run: mkdir -p dashboard/dist

      # mika-gateway is excluded — deployed via Docker to Kubernetes, not as a
      # standalone binary.
      - name: Build mika and mika-spirit
        run: |
          cargo build --release --locked --target "$TARGET" -p mika-cli --bin mika --features telemetry
          cargo build --release --locked --target "$TARGET" -p mika-agent --bin mika-spirit --features telemetry

      # install.sh extracts the archive and moves `<binary>` from its root, then
      # compares the first field of `<archive>.tar.gz.sha256`. The checksum is
      # taken from the archive's own directory so the file reads
      # `<hash>  <bare name>`, which `sha256sum --check` also accepts.
      - name: Package and checksum
        run: |
          set -euo pipefail
          mkdir dist
          for bin in mika mika-spirit; do
            archive="$bin-$TAG-$TARGET.tar.gz"
            tar -czf "dist/$archive" -C "target/$TARGET/release" "$bin"
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          done
          ls -l dist

      - name: Attest archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml

      # Pinned: the file names below are those of 0.5.x (`<package>.cdx.json`).
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      # --all-features --target all over-approximates: it covers the telemetry
      # feature of the published binaries on every platform, at the cost of
      # also listing test-only features. Listing too much is checkable; omitting
      # opentelemetry would be wrong.
      - name: Generate SBOM
        run: cargo cyclonedx --format json --all --all-features --target all

      # One SBOM per published binary, under the names docs/release-verification.md
      # gives. `cp` fails the job if cargo-cyclonedx wrote another name.
      - name: Name the SBOMs
        run: |
          set -euo pipefail
          mkdir dist
          cp crates/mika-cli/mika-cli.cdx.json "dist/mika-$TAG-sbom.cdx.json"
          cp crates/mika-agent/mika-agent.cdx.json "dist/mika-spirit-$TAG-sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error

  sign:
    name: Sign release artifacts
    needs: [prepare, build, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Sign artifacts
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *.tar.gz *.sha256 *.cdx.json; do
            cosign sign-blob --yes --bundle "$file.bundle" "$file"
          done

      # Step 2 of docs/release-verification.md, with its exact identity. If the
      # doc and this workflow drift apart, this job fails, not the user.
      - name: Verify signatures as a user would
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *.tar.gz *.sha256 *.cdx.json; do
            cosign verify-blob \
              --bundle "$file.bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/senara-solutions/mika/\.github/workflows/release\.yml@' \
              "$file"
          done
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, sign]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BASE: ${{ needs.prepare.outputs.base }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: dist

      # A published release is never overwritten. A draft is this workflow's
      # own leftover from a failed run, so a rerun removes it and starts over.
      - name: Refuse a published release, clear a leftover draft
        run: |
          set -euo pipefail
          if draft="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published"
              exit 1
            fi
            gh release delete "$TAG" --yes
          fi

      - name: Create the release as a draft
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag --draft "${flags[@]}" \
            --title "$TAG" \
            --notes-file "docs/releases/v$BASE.md"

      - name: Check the draft before making it public
        run: |
          set -euo pipefail
          got="$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)"
          if [ "$got" != "$PRERELEASE" ]; then
            echo "::error::draft $TAG has isPrerelease=$got, expected $PRERELEASE"
            exit 1
          fi

      - name: Make it public
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi

      # The barrier that matters to the family: install.sh installs this.
      - name: Check what install.sh now installs
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/releases/latest" -q .tag_name)"
          echo "releases/latest = $latest"
          if [ "$PRERELEASE" = "true" ] && [ "$latest" = "$TAG" ]; then
            gh release edit "$TAG" --draft=true
            echo "::error::candidate $TAG became latest; put back to draft"
            exit 1
          fi
          if [ "$PRERELEASE" = "false" ] && [ "$latest" != "$TAG" ]; then
            echo "::error::$TAG is published but latest is $latest"
            exit 1
          fi
