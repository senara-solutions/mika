name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: [self-hosted, Linux, X64, gentux]
    steps:
      # mika#1542: gentux self-hosted runner's _diag/pages dir can retain
      # stale .log files from cancelled / concurrent-cancelled prior jobs,
      # which collide with the new job's diagnostic file at checkout time:
      #   "The file '/var/lib/actions-runner/runner/_diag/pages/<uuid>_<uuid>_1.log' already exists."
      # Best-effort cleanup BEFORE actions/checkout removes the stale files
      # so the new job's logging handler can create its own. Silent fallback
      # if dir is missing or permissions deny — the next step's checkout will
      # then surface any real (non-stale) error.
      - name: Clean stale runner diagnostic pages (mika#1542)
        run: rm -f /var/lib/actions-runner/runner/_diag/pages/*.log 2>/dev/null || true
      # mika#1544: capture gentux runner state at job start for flake investigation.
      # The actions/checkout step fails ~3s into the job with "Missing file at path:
      # _runner_file_commands/set_output_<uuid>" on a corrupted-runner-state class.
      # Per-job snapshot of _work/_temp/_runner_file_commands/, inode count, and
      # runner process list narrows the hypothesis (state corruption vs cancel race
      # vs inode pressure) without requiring host access. Best-effort; never fails.
      - name: Capture gentux runner diagnostic snapshot (mika#1544)
        run: |
          {
            echo "=== _work/_temp/_runner_file_commands/ contents ==="
            ls -la /var/lib/actions-runner/runner/_work/_temp/_runner_file_commands/ 2>&1 | head -30 || true
            echo ""
            echo "=== _work/_temp/ top-level ==="
            ls -la /var/lib/actions-runner/runner/_work/_temp/ 2>&1 | head -10 || true
            echo ""
            echo "=== inode usage on _work/ filesystem ==="
            df -i /var/lib/actions-runner/runner/_work/ 2>&1 || true
            echo ""
            echo "=== runner processes (first 5) ==="
            pgrep -af 'Runner\.|actions-runner' 2>&1 | head -5 || true
          } 2>&1
        continue-on-error: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Install rustup if missing (self-hosted runner)
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          prefix-key: v1-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Create dashboard dist placeholder
        run: mkdir -p dashboard/dist

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Verify bundled skills structural invariants (mika#1575)
        run: make verify-bundled-skills

      - name: Dispatch-lib assertion suite (mika#1772)
        run: make test-dispatch-lib

      # mika#2312: the permission-policy plugin suite — including the AST guard
      # that refuses the registry any filesystem/network capability — ran in no
      # workflow at all, so a carve-out could merge green past the very guard
      # written to stop it. The suite carries its own negative-behaviour pins
      # (TestTheGuardBites), the discipline the three structural lints below
      # apply as a separate step.
      - name: Permission-policy plugin suite (mika#1817, mika#2312)
        run: make test-permission-policy-plugin

      - name: Plan-discovery suite (mika#2038)
        run: make test-find-issue-plan

      - name: PR-origin marker + report suites (mika#2026)
        run: make test-pr-origin

      - name: Rescue-into-open-PR signal suite (mika#2151)
        run: make test-rescue-signal

      - name: Rescue pipeline-verified producer suite (mika#2354)
        run: make test-rescue-pipeline-verified

      - name: Handler crash-step naming + trap placement (mika#2532)
        run: make test-handler-crash-step

      - name: Webhook-turn register reader — the turn is a SUM (mika#2680)
        run: make test-measure-webhook-turn-cost

      # mika#2578, une troisième fois : `make test-egress-push-bound` existait
      # dans le Makefile depuis mika#2736 et aucun fichier de `.github/` ne
      # l'appelait, donc les douze cas de la borne `git-receive-pack`
      # gataient zéro PR. Un garde que le pipeline ne lance pas ne refuse rien.
      # Les deux moitiés du resserrement de mika#2751 arrivent ensemble, et
      # c'est délibéré : `test-egress-push-bound` mesure le LECTEUR (il écrit
      # les entrées de périmètre à la main) et resterait vert si le lanceur
      # n'en déclarait jamais aucune, `test-egress-push-scope-staging` mesure
      # le PRODUCTEUR. Une seule des deux est une PR verte sous une borne
      # statique qui se croit resserrée.
      - name: Pilot sandbox secret-channel guards (mika#2039, mika#2716, mika#2724, mika#2736, mika#2751)
        run: |
          make test-sandbox-secret-argv
          make verify-no-secret-in-setenv
          make test-egress-sentinel-staging
          make test-egress-sentinel-enforcement
          make test-egress-push-bound
          make test-egress-push-scope-staging

      # mika#2578 again, same lesson as the step below: `make test-sandbox-gh-usable`
      # was local-only, so the guard that pins the VALUE `--setenv GH_TOKEN`
      # carries — now the egress sentinel (mika#2716) — gated nothing on a PR.
      # It is the suite that owns the real-bwrap half of the sentinel's contract
      # and the de-anchoring precondition (`removed == 1`), and it skips cleanly
      # when bwrap or gh is absent, so it is safe on a hosted runner.
      - name: gh usable inside the pilot sandbox (mika#2572, mika#2716)
        run: make test-sandbox-gh-usable

      # mika#2578: this suite was in `make test` — a local target CI does not
      # call — so its guards gated nothing on a PR. It now carries the scan that
      # refuses a canary writing the host GitHub credential (PART D) and the
      # behavioural half proving the staging path is redirectable (PART B), and
      # a guard the pipeline never runs refuses nothing. Its real-sandbox part
      # skips cleanly when bwrap is absent, so it is safe on a hosted runner.
      - name: GitHub token host-reachable / sandbox-absent (mika#2056, mika#2578)
        run: make test-github-token-not-in-sandbox

      # mika#2793 — the last four of the twenty-five. They land HERE, and not in
      # one of the two hosted jobs added for this ticket, because this is the
      # only runner that carries both `cargo` and a real `bwrap`, next to the
      # two real-sandbox suites above. Anywhere else they would be green by
      # PERMANENT SKIP — decorative, which is the mika#2103 defect one layer up.
      # Each degrades to a clean skip rather than a failure when its
      # precondition is missing, the property ci.yml already accepts for the two
      # steps above; here the point is the opposite, that the precondition is
      # PRESENT so the assertions actually execute. A green job does not tell
      # the two apart: read the log and check each of these four prints a
      # non-zero assertion count and not `⊘ skipped`.
      # Precondition: `cargo fmt` on PATH.
      - name: The rescue leaves a formatted tree (mika#2348)
        run: bash skills/bundled/_shared/tests/test_rescue_fmt_clean.sh
      # The same suite with no `rustup default` and an empty HOME — this
      # runner's own state, reproduced so it holds on any machine. The fixture
      # crate sits outside rust-toolchain.toml; red here means the suite went
      # back to relying on a default toolchain (mika#2826).
      - name: The rescue fmt suite without a default toolchain (mika#2826)
        run: bash skills/bundled/_shared/tests/test_rescue_fmt_clean_without_default_toolchain.sh
      # 0600 relay socket, minimal relay launch environment, and reachability
      # from a real bwrap pilot — the third point is the one the canary cannot
      # give. Precondition: a real bwrap.
      - name: Relay socket, relay env, and reachability from a real sandbox (mika#2578)
        run: bash skills/bundled/_shared/tests/test_egress_relay_socket_and_env.sh
      # git usable inside the pilot sandbox, plus the containment that bounds
      # it. Preconditions: a real bwrap AND a root it can add a worktree to —
      # it skips in a nested dispatch worktree, which is why its state had to be
      # established on the runner rather than locally (mika#2793).
      - name: git usable inside the pilot sandbox, and still contained (mika#2141)
        run: bash skills/bundled/_shared/tests/test_sandbox_git_usable.sh
      # The pilot's session-log directory is writable from inside the sandbox
      # while the incident-diagnosis surface stays out. Was red 11/5 until
      # mika#2793: its refusal probe died on a failed redirection instead of
      # reporting `refused`, so it went red precisely when the isolation worked.
      - name: The session-log bind, and what stays outside it (mika#2165)
        run: bash skills/bundled/_shared/tests/test_sandbox_log_dir_bound.sh

      - name: Test (with telemetry feature)
        run: cargo test --workspace --features telemetry

      - name: Smoke tests
        run: cargo test --test smoke -- --ignored
        env:
          MIKA_ANTHROPIC_API_KEY: "sk-ant-test-dummy-key-for-smoke"
          MIKA_INTERNAL_TOKEN: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          MIKA_ROUTING_URL: "http://localhost:19999"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w packages/ui
      - run: npm test -w packages/ui
      # <Button>'s discriminated union carries a property no runtime test can
      # observe: `<Button as="link" disabled>` must not COMPILE (mika#1801 R-2).
      # vitest transpiles with esbuild, which strips types without checking them,
      # so `Button.type-assertions.tsx` is inert unless a typechecker runs it —
      # a guard nobody runs is a decoration (mika#2103).
      - run: npm run typecheck -w packages/ui
      - run: npm run lint -w dashboard
      - run: npm run build -w dashboard
      - run: npm test -w dashboard
      # `site/` had NO compiling check at all until mika#1801: `landing-tokens-lint`
      # is a grep, and the job below says so in its own comment. Yet `site/` is a
      # root npm workspace, carries `tsc -b && vite build`, and declares
      # `@samidarko/ui` — of which it imported only the CSS. LC.2 makes the landing
      # render <Button>, i.e. its first TypeScript component import, in the one
      # surface where a broken import or type error would pass the merge without
      # reddening. This line is a precondition of that migration, not a supplement,
      # and it is ordered before it for that reason.
      #
      # It belongs in this job rather than a new one because it needs the same
      # `npm ci` and the same freshly-built `packages/ui` dist that the steps above
      # already produce. Cost is a `tsc` over twelve files.
      - run: npm run build -w site

  docs-site:
    name: Docs Site
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build

  docs-sync:
    name: Docs Sync
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       !startsWith(github.head_ref, 'release/') &&
       !startsWith(github.head_ref, 'release-please--'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check crate-local docs are in sync
        run: |
          bash scripts/sync-agent-docs.sh
          if ! git diff --exit-code crates/mika-agent/docs/; then
            echo ""
            echo "::error::Crate-local docs are out of sync with docs/"
            echo "Run: bash scripts/sync-agent-docs.sh"
            echo "Then commit the updated files in crates/mika-agent/docs/"
            exit 1
          fi

  byte-slice-lint:
    name: Byte Slice Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check for unsafe byte-slice patterns
        run: bash scripts/check-byte-slices.sh
      # A guard nobody has watched go red is a decoration — mika#2103 is the
      # incident where this very lint stayed green through 26 panics.
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-byte-slices.sh

  substrate-leak-lint:
    name: Substrate Leak Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject substrate-configuration detail reaching the LLM (mika#1964)
        run: bash scripts/check-substrate-leak.sh
      # A guard nobody has watched go red is a decoration — and mika#1964's own
      # founding defect is a companion guard a test comment promised and that
      # existed nowhere in the tree. The four negative controls in this suite are
      # what make the lint above a measurement rather than a claim.
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-substrate-leak.sh

  image-tag-immutability-lint:
    name: Image Tag Immutability Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject image tags not derived from the commit sha (mika#2143)
        run: bash scripts/check-image-tags-immutable.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-image-tags-immutable.sh

  a2a-timeout-literal-lint:
    name: A2A Timeout Literal Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject hardcoded timeout budgets on the a2a path (mika#2309)
        run: bash scripts/check-a2a-timeout-literals.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-a2a-timeout-literals.sh

  eval-ignored-flags-lint:
    name: Eval Ignored Flags Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # `eval-calibration.yml` passed `--ignored` AND `--include-ignored` to the
      # same cargo invocation for 17 red runs (2026-06-22 → 2026-10-12). libtest
      # refuses the pair, `|| true` hid the refusal, and the step that failed was
      # the next one — so the cause was never read. The predicate is the
      # CO-OCCURRENCE at one invocation site, never the presence of either flag:
      # both are legitimate alone, and a rule that accuses a correct invocation
      # is a rule that gets disarmed (mika#2683).
      - name: Reject mutually exclusive libtest flags at one invocation site (mika#2683)
        run: bash scripts/check-eval-ignored-flags.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-eval-ignored-flags.sh

  pilot-push-lint:
    name: Pilot Push Site Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # A skill handler does not push. The 2026-09-24 rewind of `origin/main`
      # came from a bare `git push --force-with-lease` written into a handler's
      # prompt; the push now lives in the guarded shared helper (mika#2520).
      - name: Reject unguarded push sites in skill handlers (mika#2520)
        run: bash scripts/check-pilot-push-sites.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint and a2a-timeout-literal-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-pilot-push-sites.sh
      # The push helper's own contract: five fail-closed refusals, an explicit
      # destination refspec, and a lease pinned to a pre-session SHA.
      - name: Pin the PR-branch push guard
        run: bash skills/bundled/_shared/tests/test_pr_push_guard.sh

  cwd-guard-lint:
    name: Cwd Guard Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # `build-mika` crashed four times on the QA of PR #2530 with the same
      # uninformative `tasks.result`: "HANDLER CRASH (exit code 1)". The crash
      # was `cd "$CWD"`, whose stderr the long-running path discards. An
      # uncomposable cwd is now refused BY NAME, in the callback body, and the
      # ORDER of the four refusals is itself asserted — a variable-literal cwd
      # reported as "does_not_exist" sends an operator to create a directory
      # instead of fixing a prompt (mika#2536).
      # The suite carries its own THREE negative controls, in the behavioural-suite
      # idiom of `test_pr_push_guard.sh` N1–N3 rather than as a second script: V3
      # runs a FROZEN pre-fix fixture of the handler (which delivers the generic
      # crash, so the named-refusal assertion is seen red on the code this ticket
      # supersedes), and N1/N2 mutate a copy of the guard in a subshell. Without
      # them, "the guard refuses" is indistinguishable from "the harness asserts
      # something always true" — the discipline byte-slice-lint and
      # pilot-push-lint above state as a separate step because their subject is a
      # source scan, not a behaviour (mika#2103).
      - name: Pin the four named cwd refusals, their order, and their negative controls (mika#2536)
        run: bash scripts/test-cwd-guard.sh

  python-installer-guard-lint:
    name: Python Installer Guard Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # On 2026-10-02 mika-qa ran `pip install -e . --break-system-packages`
      # through run_shell while reviewing a claude-pilot PR, rewrote
      # ~/.local/bin/claude-pilot with the system Python's shebang, and killed
      # the production launcher for 2 h 45 (mika#2634). Over 48 h, 43 run_shell
      # calls carried `pip install`; only the 5 carrying that flag could write —
      # the host's protection held by PEP 668, i.e. by accident, until the agent
      # learned to opt out of it (mika#2639).
      # The harness is HERMETIC AND INSTALLS NOTHING: PATH shims and a fake
      # `<worktree>/.venv/bin/pip` write a sentinel, so a refused form is proven
      # to have been stopped BEFORE `eval` by the ABSENCE of that sentinel, and a
      # positive control is proven to have RUN by its presence — without which
      # "not refused" is indistinguishable from "refused by another block"
      # (mika#2205). The five AC1 evasion forms are asserted ONE BY ONE, never
      # neutralised together (mika#2277), and the suite carries its own negative
      # control: it strips the block from a copy of the handler and checks that
      # it would go red. Same step-level discipline as cwd-guard-lint above.
      - name: Pin the run_shell refusal of host-Python installers, negative control included (mika#2639)
        run: bash scripts/test-python-installer-guard.sh

  canonical-tokens-lint:
    name: Canonical Token Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # The list must be EXHAUSTIVE against the code that matches (mika#2201,
      # Prime's closing bound). This mode is the shell half of that guard; the
      # Rust half runs in the normal `cargo test` job
      # (canonical_tokens::tests::mika2201_*). They are complementary, not
      # redundant: one starts from the reading FORM, the other from the TOKEN.
      - name: Confront the canonical list to the tree (mika#2201)
        run: bash scripts/canonical-tokens-survey.sh --check
      # The lint itself, on S1 — the repository's prescribers. A prompt that
      # prescribes a wrong form reproduces it on every ticket it produces, which
      # is where `seconde passe` would have become systematic again.
      - name: Reject non-canonical machine tokens in prescribers (mika#2201)
        run: bash scripts/check-canonical-tokens.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint above (mika#2103). This suite also pins the half that
      # matters most here: that the lint does NOT bite on `seconde passe`, which
      # `grooming_marker.rs` reads by written decision (mika#2201 § R1).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-canonical-tokens.sh

  dispatch-seats-lint:
    name: Dispatch Seat Declaration Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # An undeclared seat label is DELETED by label-sync (delete-other-labels:
      # true) from the repo and every issue carrying it, with no `unlabeled`
      # event — the seat gate then refuses nothing and says nothing (mika#2092).
      - name: Reject drift between KNOWN_DISPATCH_SEATS and labels.yml (mika#2092)
        run: bash scripts/check-dispatch-seats-declared.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint and image-tag-immutability-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-dispatch-seats-declared.sh

  pilot-turn-ceiling-labels-lint:
    name: Pilot Turn-Ceiling Label Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # A ceiling label absent from labels.yml is DELETED by label-sync
      # (delete-other-labels: true) from the repo and every issue carrying it,
      # with no `unlabeled` event — the raised ceiling then applies to nobody and
      # the dispatch line reads like a fleet with no such ticket (mika#2542).
      - name: Reject an undeclared PILOT_LABEL_TURN_CEILINGS key (mika#2542)
        run: bash scripts/check-pilot-turn-ceiling-labels.sh
      # A guard nobody has watched go red is a decoration (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-pilot-turn-ceiling-labels.sh

  root-files-lint:
    name: Root File Declaration Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # A pilot work draft committed at the root is read by nobody, referenced by
      # nothing, and every dispatch worktree carries it along from `main` — three
      # did, one of them for five months (mika#2760). No rescue exclusion stops
      # the one the pilot commits itself, inside its own PR.
      - name: Reject a tracked root file that root-files-declared.txt does not declare (mika#2760)
        run: bash scripts/check-root-files.sh
      # A guard nobody has watched go red is a decoration (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-root-files.sh

  suite-wiring-lint:
    name: Suite Wiring Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # A suite on disk that no workflow reaches refuses nothing: it passes
      # review, it passes CI by construction, and the defect it was written to
      # catch lands in production. mika#2578 once, mika#2752 twice; the doctrine
      # existed from the first occurrence and nothing enforced it. This step is
      # also the lint's own wiring — it is the first subject of its own rule.
      - name: Reject a suite neither reached by CI nor declared (mika#2761)
        run: bash scripts/check-suite-wiring.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # dispatch-seats-lint above (mika#2103). The anti-vacuity suite is what
      # makes the four directions D1–D4 more than an intention: each is seen red
      # on a fixture tree AND green once the fixture is repaired.
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-suite-wiring.sh

  # ───────────────────────────────────────────────────────────────────────────
  # The guards of the repository's own tooling — written, reviewed, merged, and
  # then left without a launcher. mika#2761 delivered the REFUSAL (the job
  # above); this job is the catch-up (mika#2793). Every suite below runs offline
  # in seconds: no cargo, no bwrap, no network, no token. They were not outside
  # CI for a reason — nobody had wired them, and nothing said so out loud until
  # the registry made the backlog countable.
  #
  # Three of them were ALREADY RED when this job was written, and one was not
  # hermetic. That is what mika#2578 costs in practice: a guard the pipeline
  # does not run refuses nothing, and while it refuses nothing it rots with no
  # witness. One step per suite, deliberately: the step name is what a reader of
  # the Checks page sees when a suite goes red, and a grouped `run: |` block
  # makes "which one" invisible without opening the log.
  # ───────────────────────────────────────────────────────────────────────────
  offline-script-suites:
    name: Offline Script Suites
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # Guard + proof-of-guard, in that order, through the existing `make`
      # target: the target already encodes the ordering, and duplicating it in
      # YAML would create a second site of truth for it. mika#1801 wrote that
      # "the fifteen scripts/check-*.sh are all wired"; this pair is why that
      # sentence stopped being true — the exact situation of check-cta-primitives.sh,
      # "the only exception in its family, which is precisely why nobody looked
      # for it".
      - name: Release profile keeps the line tables a wedged binary needs (mika#1719)
        run: make check-release-debuginfo
      # The load-bearing invariant of the mika#893 factorisation: dev-pilot and
      # dev-groom differ only by their entry slash command. Pure structural diff
      # over two tracked files.
      - name: dev-pilot and dev-groom differ only by their entry command (mika#893)
        run: bash scripts/test-dispatch-symmetry.sh
      # Keeps the empty-turn measurement from counting the guardrails constant
      # as the event.
      - name: The empty-turn measure does not count the guardrails as the event (mika#1910)
        run: bash scripts/test-measure-empty-turns.sh
      # Same class one measure over: the anchor must be derived from the
      # producer, never reverse-engineered from a log, or 2349 of 2352 sessions
      # read as silent. This suite was red on `0170f5cd` — the measured script
      # was committed 100644 while the suite requires 100755 (mika#2793).
      - name: The cycle-emptiness anchor comes from the producer (mika#1950)
        run: bash scripts/test-measure-pilot-cycle-emptiness.sh
      # The mika-arch-groom-milestone bundle's scaffold and its registration
      # sites. Also red on `0170f5cd`: it asserted a per-skill LLM override site
      # that mika#949 removed eleven months ago.
      - name: The groom-milestone bundle and its registration sites (mika#879)
        run: bash scripts/test-mika-groom-milestone.sh
      # AC4 of the search smoke — a 404 `search_upstream_not_configured` must
      # exit non-zero. Its own header states it was built to run in CI with no
      # gateway, no database, no token and no upstream request; it was unwired
      # anyway, which is the mika#2578 shape at its purest.
      - name: A search upstream that answers 404 is not a healthy smoke (mika#2407)
        run: bash scripts/test-smoke-search-substrate.sh
      # The webhook-chain probe's decision table AND its silence on a healthy
      # chain. Two throwaway `python3 -m http.server` stand-ins; every curl call
      # stays on loopback.
      - name: The webhook-chain probe's decision table and its silence (mika#2135)
        run: bash scripts/test-smoke-webhook-chain.sh
      # The offline half of the `operator` entry that stays in the registry: it
      # fakes `gh` and replays both topology states, so the operator script's own
      # logic is guarded even though the operator script itself cannot be.
      - name: The dependabot topology verifier's own logic, with gh faked (mika#1997)
        run: bash scripts/test-verify-dependabot-topology.sh
      # The harness of the script every flight is required to end on. mika#2516
      # is what its absence from CI has already cost once: a guard announced
      # inside verify-pipeline.sh, never delivered, and nobody saw it. It was
      # also non-hermetic until mika#2793 — 29 commits on an inherited git
      # identity, which would have failed on this very runner.
      - name: The harness of verify-pipeline.sh, the script every flight ends on (mika#861)
        run: bash scripts/verify-pipeline-test.sh

  # ───────────────────────────────────────────────────────────────────────────
  # The other half of the mika#2793 catch-up: the guards of the plumbing EVERY
  # flight of the autonomous loop goes through — WIP rescue, push/rebase retry,
  # the seat stamped on a dispatched issue, the gate before a PR is published,
  # transcript redaction. When one of these breaks, a pilot is wedged and the
  # operator reads the suite's output to find out why; it is precisely the code
  # that most needs a launcher, and it had none.
  #
  # The split from `offline-script-suites` above follows the root (`scripts/` vs
  # `skills/bundled/_shared/`), which is also a split of nature: repository
  # tooling on one side, dispatch plumbing on the other. Two parallel hosted
  # jobs add nothing to the critical path.
  #
  # None of these touches the network, a token, cargo or bwrap. The seven that
  # build git fixtures declare their own `user.email`/`user.name` on the fixture
  # repo; the four others never commit — checked, because inheriting the host's
  # global identity is the exact non-hermeticity mika#2793 had to repair in
  # scripts/verify-pipeline-test.sh.
  # ───────────────────────────────────────────────────────────────────────────
  dispatch-lib-offline-suites:
    name: Dispatch-lib Offline Suites
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # The redaction applied to pilot transcripts before they are written. Its
      # header gave the bare `bash` invocation as the only way to run it.
      - name: Redaction applied to pilot transcripts before they are written (mika#903)
        run: bash skills/bundled/_shared/test-trace-redaction.sh
      # The gate dispatch-lib applies before it publishes a PR. `gh` is faked.
      - name: The gate applied before a PR is published (mika#1941)
        run: bash skills/bundled/_shared/tests/test_finalize_pr_gate.sh
      # The refusal of a force-push from a dispatch worktree.
      - name: A force-push from a dispatch worktree is refused (mika#1318)
        run: bash skills/bundled/_shared/tests/test_force_push_guard.sh
      # The token grammar of `_parse_disposition` — a pure function over
      # strings. Nothing in this repository is cheaper to run in CI.
      - name: The token grammar of _parse_disposition (mika#1272)
        run: bash skills/bundled/_shared/tests/test_parse_disposition.sh
      # The push/rebase retry loop, against local repositories.
      - name: The push/rebase retry loop (mika#1857)
        run: bash skills/bundled/_shared/tests/test_push_with_rebase_retry.sh
      # The cause token the WIP rescue stamps on the draft it opens.
      - name: The cause token stamped on a rescue draft (mika#2539)
        run: bash skills/bundled/_shared/tests/test_rescue_cause_token.sh
      # A rescue draft never carries a `Closes` line: a rescued WIP must not
      # close the ticket it failed to finish.
      - name: A rescue draft carries no Closes line (mika#2157)
        run: bash skills/bundled/_shared/tests/test_rescue_closes_guard.sh
      # The rescue commit does not silently bypass the hooks.
      - name: The rescue commit does not bypass the hooks (mika#1685)
        run: bash skills/bundled/_shared/tests/test_rescue_commit_no_verify.sh
      # .pilot-scratch/ never reaches a published commit — the invariant every
      # dispatch rule about scratch files rests on.
      - name: .pilot-scratch never reaches a published commit (mika#1282)
        run: bash skills/bundled/_shared/tests/test_rescue_scratch_not_published.sh
      # The two invariants of worktree command seeding: never overwrite a
      # command the branch tracks, never dirty `git status`. Their breach was
      # the dirty-worktree cause behind mika#1414.
      - name: The two invariants of worktree command seeding (mika#1415)
        run: bash skills/bundled/_shared/tests/test_seed_worktree_slash_commands.sh
      # The seat stamped on a dispatched issue. `gh` is faked.
      - name: The seat stamped on a dispatched issue (mika#2155)
        run: bash skills/bundled/_shared/tests/test_stamp_issue_seat.sh

  issue-annotation-guard-lint:
    name: Issue Annotation Guard Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # The annotation workflow used to resolve its PATCH target by rewriting an
      # html url, which yielded `…/issues/N#issuecomment-ID`. The fragment is not
      # transmitted over HTTP, so the effective target was the ISSUE-edit route
      # and `-f body=` replaced the issue body — measured on mika#2544, where a
      # groomed body lost its Branch / Plan / Grooming history callouts and the
      # engine then routed a second groom instead of the implement (mika#2552).
      #
      # `issues: write` is necessary for `gh issue comment` and GitHub offers no
      # "comment without editing the body" granularity, so what bounds the
      # workflow can only ever be a predicate on the TARGET. Removing that
      # predicate makes no decision wrong on the day it is written — the net just
      # disappears, in silence — which is why the shape is scanned in addition to
      # the behaviour being pinned (the mika#2511 argument).
      - name: Reject a PATCH site that bypasses the comment-target guard (mika#2552)
        run: bash scripts/check-issue-comment-patch-guard.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # pilot-push-lint and dispatch-seats-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-annotate-issue-token-comment.sh

  landing-tokens-lint:
    name: Landing Token Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # The landing consumes the rulebook §2 palette from @samidarko/ui/theme.css
      # (mika#1804, LC.5). A colour literal written back into site/ is a colour
      # that stops tracking the rulebook — silently, and only visible the next
      # time the rulebook moves. `site/` has no other automated check at all.
      - name: Reject hardcoded colours in the landing (mika#1804)
        run: bash scripts/check-landing-tokens.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint and dispatch-seats-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-landing-tokens.sh

  cta-primitives-lint:
    name: CTA Primitives Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # Every CTA on every surface is rendered by <Button> from @samidarko/ui,
      # which implements rulebook §5 — including the §2 gradient a flat fill
      # cannot reproduce (mika#1801, LC.2). Ten CTAs were hand-rolled across
      # `dashboard/src` and `site/src` on 2026-09-27, none of them a gradient;
      # the eleventh would have been written in good faith on a new button, so
      # the rule is on the SHAPE (a solid background on a `<button>`/`<a>`) and
      # not on a denylist of the ten measured classes. Sibling of
      # `landing-tokens-lint` above: same surfaces, same reason a drift there is
      # only visible the next time the rulebook moves.
      - name: Reject hand-rolled CTAs outside <Button> (mika#1801)
        run: bash scripts/check-cta-primitives.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # landing-tokens-lint above (mika#2103). This suite also pins the halves a
      # red run cannot show: that the scan does NOT fire on a chip fill, a
      # hover-only fill or a non-interactive `bg-accent`, and that an empty
      # perimeter or a zero-CTA population is refused (exit 3) rather than read
      # as a clean tree (mika#2205).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-cta-primitives.sh

  publish-verify-lint:
    name: Publish Verify Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # `publish-ui.yml` ne se déclenche que sur `packages/ui/**`, donc quelques
      # fois par mois : la boucle de vérification qu'il porte n'était exercée par
      # rien, et son insuffisance ne se découvrait qu'au bump suivant, sur `main`,
      # en rouge (mika#1917 puis mika#2566, deux occurrences de la même classe).
      # Ce job est ce qui rompt cette série — il exerce la logique sur CHAQUE PR,
      # hors réseau, sans npm réel, en moins d'une seconde.
      #
      # Contrôles négatifs joués à la livraison et consignés en tête du harnais :
      # un script remplacé par `exit 1` laisse N3 (AC2) vert et fait rougir N7 —
      # c'est pour ce cas précis que N7 existe.
      - name: Exercise the post-publish verification, AC1 and AC2 included (mika#2566)
        run: bash scripts/test-verify-npm-publish.sh

  pilot-instruction-paths-lint:
    name: Pilot Instruction Paths Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject host-workspace paths in the pilot's auto-loaded surface (mika#2108)
        run: bash scripts/check-pilot-instruction-paths.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # byte-slice-lint above (mika#2103).
      - name: Pin the guard's negative behaviour
        run: bash scripts/test-check-pilot-instruction-paths.sh

  loop-select-lint:
    name: Loop Select Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject tokio::select! inside run_loop (mika#848)
        run: bash scripts/check-loop-select.sh

  shared-checkout-guard-lint:
    name: Shared Checkout Guard Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # Les quatre occurrences mesurées de mika#2107 sont des fixtures nommées.
      # mika#2449 added the `--decide-primary` mode (run_shell → primary
      # checkout); the same harness pins both modes, M0's three commands verbatim.
      - name: Pin the guard's behaviour on the four measured occurrences (mika#2107) and the primary-checkout mode (mika#2449)
        run: bash scripts/test-guard-shared-checkout.sh
      # The wiring of the primary mode into the shell-exec handler. A handler
      # that calls nothing is green exactly like one that refuses; this harness
      # strips the call and checks that it would go red (mika#2449 V5).
      - name: Pin the run_shell wiring of the primary-checkout guard, negative control included (mika#2449)
        run: bash scripts/test-shell-exec-guard.sh
      # La régression que ce check attrape ne rend AUCUNE décision fausse : elle
      # rend la garde absente, et les assertions comportementales ci-dessus
      # restent toutes vertes pendant que plus aucune session ne la charge.
      - name: Reject a settings.json that lost the PreToolUse hook (mika#2107)
        run: bash scripts/check-shared-checkout-guard-wiring.sh
      # A guard nobody has watched go red is a decoration — same discipline as
      # dispatch-seats-lint above (mika#2103).
      - name: Pin the wiring check's negative behaviour
        run: bash scripts/test-check-shared-checkout-guard-wiring.sh

  egress-uniqueness-lint:
    name: Egress Uniqueness Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # Ce lint DÉRIVE ses PATTERNS du manifeste depuis mika#2408 (AC5), donc il
      # lit du TOML, donc il exige `tomllib` (stdlib >= 3.11). `ubuntu-22.04`
      # porte Python 3.10 : sans cette étape le job rougit sur
      # `ModuleNotFoundError`. La version est DÉCLARÉE ici plutôt que héritée de
      # l'image — une bascule de runner ne doit pas décider en silence si une
      # garde de confinement peut tourner.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Enforce single-controlled search egress (mika#1807 AC4)
        run: bash scripts/verify-egress-uniqueness.sh

  voice-non-transit-lint:
    name: Voice Non-Transit Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce testimony-lane non-transit invariant (mika#1796)
        # No-op until mika#1787 lands the testimony subtree; enforcing on
        # every subsequent PR. Same shape as egress-uniqueness-lint above.
        run: bash scripts/verify-voice-non-transit.sh

  egress-request-shape-lint:
    name: Egress Request Shape Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce E3 dé-liage identité↔requête (mika#1809)
        run: bash scripts/verify-egress-request-shape.sh

  egress-no-log-lint:
    name: Egress No-Log Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce no-log discipline on egress substrate (mika#1810 E4)
        run: bash scripts/verify-egress-no-log.sh
      - name: Pin the egress no-log guard's negative behaviour (mika#2054)
        run: bash scripts/test-verify-egress-no-log.sh
      - name: Pin the egress audit's declared search_* event list (mika#2788)
        run: bash scripts/test-audit-egress-no-log.sh

  egress-manifest-lint:
    name: Egress Manifest Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # Le moteur du lockstep lit le manifeste TOML via `tomllib` (stdlib
      # >= 3.11) et `ubuntu-22.04` porte Python 3.10. Même raison qu'au job
      # `egress-uniqueness-lint` ci-dessus ; le câblage des deux est tenu par
      # l'assertion N16 de `scripts/test-verify-egress-manifest.sh`.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - name: Enforce manifest↔code lockstep on outbound sinks (mika#2408)
        run: bash scripts/verify-egress-manifest.sh --report
      - name: Pin the guard's negative behaviour in all four directions (AC1, AC1b)
        run: bash scripts/test-verify-egress-manifest.sh

  sigpipe-grep-lint:
    name: SIGPIPE grep-q Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject `printf|echo | grep -q` under pipefail (mika#2055)
        run: bash scripts/verify-no-sigpipe-grep.sh
      - name: Anti-vacuity — the guard must be able to fail (mika#2055)
        run: bash scripts/test-verify-no-sigpipe-grep.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Scan changed files for secrets and oversized blobs (mika#1689)
        run: bash scripts/check-secrets.sh --changed origin/main

  pilot-egress-status-tap:
    name: Pilot Egress Status Tap
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Verify the pilot egress-proxy status tap + body framing (mika#1901, #2317)
        run: python3 -B scripts/test-pilot-egress-proxy-status.py
      # mika#2313's AC1 guard. It existed since 2026-09-16 and was referenced by
      # no Makefile target and no CI job — a test that ran nowhere. Wired here
      # because mika#2317 already touches this job (plan R3).
      - name: Verify the mika#2313 hop-by-hop header guard
        run: python3 -B scripts/test-pilot-egress-keepalive.py

  pipeline-artifacts:
    name: Pipeline Artifacts
    runs-on: ubuntu-22.04
    # Exclusions de branche : ces auteurs automatiques ne peuvent structurellement
    # pas produire l'artefact que le gate exige. Dependabot n'écrit ni plan doc ni
    # trailer `Pipeline-Exempt:` (mika#860) — activer dependabot.yml sans cette
    # ligne a bloqué 11 PRs vertes par ailleurs (mika#2010).
    # Le gate reste entier pour tout le reste : un head_ref hors de ces préfixes
    # continue de REJECT sur une PR code-only sans plan.
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release/') &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Verify pipeline artifacts
        env:
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/verify-pipeline.sh origin/main

  docker-build-filter:
    name: Docker Build Filter
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    outputs:
      # mika#1484: two independent filters. `images-relevant` gates the fast
      # agent/gateway Rust-image builds (genuinely affected by code changes).
      # `os-relevant` gates the 5 slow os/Dockerfile Gentoo stage3 builds, which
      # must only run when os/** or a Dockerfile actually changes — a crates/**
      # change previously tripped hours of Gentoo builds with no merge-gate value.
      images-relevant: ${{ steps.filter.outputs.images-relevant }}
      os-relevant: ${{ steps.filter.outputs.os-relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            images-relevant:
              - 'Dockerfile.agent'
              - 'Dockerfile.gateway'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            os-relevant:
              - 'os/**'
              - '**/Dockerfile*'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-22.04
    needs: docker-build-filter
    if: github.event_name == 'pull_request' && needs.docker-build-filter.outputs.images-relevant == 'true'
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.agent
            tag: mika-agent
          - dockerfile: Dockerfile.gateway
            tag: mika-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v3
      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          tags: ${{ matrix.tag }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
          platforms: linux/amd64

  # mika#1484: os/Dockerfile Gentoo stage3 builds (hours each) — gated on
  # os-relevant so they run ONLY on PRs touching os/** or any Dockerfile,
  # never on routine crates/** changes.
  docker-build-os:
    name: Docker Build OS
    runs-on: ubuntu-22.04
    needs: docker-build-filter
    if: github.event_name == 'pull_request' && needs.docker-build-filter.outputs.os-relevant == 'true'
    strategy:
      matrix:
        include:
          - dockerfile: os/Dockerfile
            target: mika-os
            tag: mika-os
          - dockerfile: os/Dockerfile
            target: mika-runtime-server
            tag: mika-runtime-server
          - dockerfile: os/Dockerfile
            target: mika-runtime-gateway
            tag: mika-runtime-gateway
          # mika-runtime-cli split to canari self-hosted job (mika#1919 Phase 1)
          - dockerfile: os/Dockerfile
            target: mika-runtime-all
            tag: mika-runtime-all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v3
      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          tags: ${{ matrix.tag }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
          platforms: linux/amd64

  # ------------------------------------------------------------------
  # Phase 1 canari (mika#1919, Vincent-authorized 2026-08-19):
  # Migrate mika-runtime-cli ONLY to self-hosted gentux runner.
  # Other targets stay on ubuntu-22.04 above. Rollback = flip runs-on.
  #
  # GHCR pull-through registry cache avoids rebuild of base layers.
  # Storage-delta instrumentation captures df/docker system df pre+post
  # so root can calibrate prune cadence against measured accumulation.
  #
  # concurrency group prevents stacking on the single gentux runner.
  # ------------------------------------------------------------------
  docker-build-os-canari-cli:
    name: Docker Build OS (mika-runtime-cli — self-hosted gentux canari)
    runs-on: [self-hosted, gentux, docker]
    needs: docker-build-filter
    if: github.event_name == 'pull_request' && needs.docker-build-filter.outputs.os-relevant == 'true'
    concurrency:
      group: docker-canari-cli-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v3
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Storage delta — BEFORE
        run: |
          echo "=== canari mika-runtime-cli — BEFORE build ==="
          df -h /
          docker system df
      - name: Build mika-runtime-cli
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v6
        with:
          context: .
          file: os/Dockerfile
          target: mika-runtime-cli
          tags: mika-runtime-cli:ci
          push: false
          load: true
          cache-from: type=registry,ref=ghcr.io/senara-solutions/mika-cache:mika-runtime-cli
          cache-to: type=registry,ref=ghcr.io/senara-solutions/mika-cache:mika-runtime-cli,mode=max
          platforms: linux/amd64
      - name: Storage delta — AFTER
        if: always()
        run: |
          echo "=== canari mika-runtime-cli — AFTER build ==="
          df -h /
          docker system df

  security:
    name: Security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml
      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Run cargo-audit
        run: cargo audit
      - name: Run cargo-deny
        run: cargo deny check
