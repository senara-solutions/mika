name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: [self-hosted, Linux, X64, gentux]
    steps:
      # mika#1542: gentux self-hosted runner's _diag/pages dir can retain
      # stale .log files from cancelled / concurrent-cancelled prior jobs,
      # which collide with the new job's diagnostic file at checkout time:
      #   "The file '/var/lib/actions-runner/runner/_diag/pages/<uuid>_<uuid>_1.log' already exists."
      # Best-effort cleanup BEFORE actions/checkout removes the stale files
      # so the new job's logging handler can create its own. Silent fallback
      # if dir is missing or permissions deny — the next step's checkout will
      # then surface any real (non-stale) error.
      - name: Clean stale runner diagnostic pages (mika#1542)
        run: rm -f /var/lib/actions-runner/runner/_diag/pages/*.log 2>/dev/null || true
      # mika#1544: capture gentux runner state at job start for flake investigation.
      # The actions/checkout step fails ~3s into the job with "Missing file at path:
      # _runner_file_commands/set_output_<uuid>" on a corrupted-runner-state class.
      # Per-job snapshot of _work/_temp/_runner_file_commands/, inode count, and
      # runner process list narrows the hypothesis (state corruption vs cancel race
      # vs inode pressure) without requiring host access. Best-effort; never fails.
      - name: Capture gentux runner diagnostic snapshot (mika#1544)
        run: |
          {
            echo "=== _work/_temp/_runner_file_commands/ contents ==="
            ls -la /var/lib/actions-runner/runner/_work/_temp/_runner_file_commands/ 2>&1 | head -30 || true
            echo ""
            echo "=== _work/_temp/ top-level ==="
            ls -la /var/lib/actions-runner/runner/_work/_temp/ 2>&1 | head -10 || true
            echo ""
            echo "=== inode usage on _work/ filesystem ==="
            df -i /var/lib/actions-runner/runner/_work/ 2>&1 || true
            echo ""
            echo "=== runner processes (first 5) ==="
            pgrep -af 'Runner\.|actions-runner' 2>&1 | head -5 || true
          } 2>&1
        continue-on-error: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Install rustup if missing (self-hosted runner)
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2
        with:
          prefix-key: v1-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Create dashboard dist placeholder
        run: mkdir -p dashboard/dist

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      - name: Verify bundled skills structural invariants (mika#1575)
        run: make verify-bundled-skills

      - name: Test (with telemetry feature)
        run: cargo test --workspace --features telemetry

      - name: Smoke tests
        run: cargo test --test smoke -- --ignored
        env:
          MIKA_ANTHROPIC_API_KEY: "sk-ant-test-dummy-key-for-smoke"
          MIKA_INTERNAL_TOKEN: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          MIKA_ROUTING_URL: "http://localhost:19999"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build -w packages/ui
      - run: npm test -w packages/ui
      - run: npm run lint -w dashboard
      - run: npm run build -w dashboard
      - run: npm test -w dashboard

  docs-site:
    name: Docs Site
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build

  docs-sync:
    name: Docs Sync
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       !startsWith(github.head_ref, 'release/') &&
       !startsWith(github.head_ref, 'release-please--'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check crate-local docs are in sync
        run: |
          bash scripts/sync-agent-docs.sh
          if ! git diff --exit-code crates/mika-agent/docs/; then
            echo ""
            echo "::error::Crate-local docs are out of sync with docs/"
            echo "Run: bash scripts/sync-agent-docs.sh"
            echo "Then commit the updated files in crates/mika-agent/docs/"
            exit 1
          fi

  byte-slice-lint:
    name: Byte Slice Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check for unsafe byte-slice patterns
        run: bash scripts/check-byte-slices.sh

  loop-select-lint:
    name: Loop Select Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Reject tokio::select! inside run_loop (mika#848)
        run: bash scripts/check-loop-select.sh

  egress-uniqueness-lint:
    name: Egress Uniqueness Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce single-controlled search egress (mika#1807 AC4)
        run: bash scripts/verify-egress-uniqueness.sh

  voice-non-transit-lint:
    name: Voice Non-Transit Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce testimony-lane non-transit invariant (mika#1796)
        # No-op until mika#1787 lands the testimony subtree; enforcing on
        # every subsequent PR. Same shape as egress-uniqueness-lint above.
        run: bash scripts/verify-voice-non-transit.sh

  egress-request-shape-lint:
    name: Egress Request Shape Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce E3 dé-liage identité↔requête (mika#1809)
        run: bash scripts/verify-egress-request-shape.sh

  egress-no-log-lint:
    name: Egress No-Log Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Enforce no-log discipline on egress substrate (mika#1810 E4)
        run: bash scripts/verify-egress-no-log.sh

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Scan changed files for secrets and oversized blobs (mika#1689)
        run: bash scripts/check-secrets.sh --changed origin/main

  pilot-egress-status-tap:
    name: Pilot Egress Status Tap
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Verify the pilot egress-proxy upstream-status tap (mika#1901)
        run: python3 -B scripts/test-pilot-egress-proxy-status.py

  pipeline-artifacts:
    name: Pipeline Artifacts
    runs-on: ubuntu-22.04
    # Exclusions de branche : ces auteurs automatiques ne peuvent structurellement
    # pas produire l'artefact que le gate exige. Dependabot n'écrit ni plan doc ni
    # trailer `Pipeline-Exempt:` (mika#860) — activer dependabot.yml sans cette
    # ligne a bloqué 11 PRs vertes par ailleurs (mika#2010).
    # Le gate reste entier pour tout le reste : un head_ref hors de ces préfixes
    # continue de REJECT sur une PR code-only sans plan.
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'release/') &&
      !startsWith(github.head_ref, 'release-please--') &&
      !startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - name: Verify pipeline artifacts
        env:
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/verify-pipeline.sh origin/main

  docker-build-filter:
    name: Docker Build Filter
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    outputs:
      # mika#1484: two independent filters. `images-relevant` gates the fast
      # agent/gateway Rust-image builds (genuinely affected by code changes).
      # `os-relevant` gates the 5 slow os/Dockerfile Gentoo stage3 builds, which
      # must only run when os/** or a Dockerfile actually changes — a crates/**
      # change previously tripped hours of Gentoo builds with no merge-gate value.
      images-relevant: ${{ steps.filter.outputs.images-relevant }}
      os-relevant: ${{ steps.filter.outputs.os-relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            images-relevant:
              - 'Dockerfile.agent'
              - 'Dockerfile.gateway'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - '.github/workflows/ci.yml'
            os-relevant:
              - 'os/**'
              - '**/Dockerfile*'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-22.04
    needs: docker-build-filter
    if: github.event_name == 'pull_request' && needs.docker-build-filter.outputs.images-relevant == 'true'
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile.agent
            tag: mika-agent
          - dockerfile: Dockerfile.gateway
            tag: mika-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3
      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          tags: ${{ matrix.tag }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
          platforms: linux/amd64

  # mika#1484: os/Dockerfile Gentoo stage3 builds (hours each) — gated on
  # os-relevant so they run ONLY on PRs touching os/** or any Dockerfile,
  # never on routine crates/** changes.
  docker-build-os:
    name: Docker Build OS
    runs-on: ubuntu-22.04
    needs: docker-build-filter
    if: github.event_name == 'pull_request' && needs.docker-build-filter.outputs.os-relevant == 'true'
    strategy:
      matrix:
        include:
          - dockerfile: os/Dockerfile
            target: mika-os
            tag: mika-os
          - dockerfile: os/Dockerfile
            target: mika-runtime-server
            tag: mika-runtime-server
          - dockerfile: os/Dockerfile
            target: mika-runtime-gateway
            tag: mika-runtime-gateway
          # mika-runtime-cli split to canari self-hosted job (mika#1919 Phase 1)
          - dockerfile: os/Dockerfile
            target: mika-runtime-all
            tag: mika-runtime-all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3
      - name: Build ${{ matrix.tag }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          tags: ${{ matrix.tag }}:ci
          push: false
          load: true
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
          platforms: linux/amd64

  # ------------------------------------------------------------------
  # Phase 1 canari (mika#1919, Vincent-authorized 2026-08-19):
  # Migrate mika-runtime-cli ONLY to self-hosted gentux runner.
  # Other targets stay on ubuntu-22.04 above. Rollback = flip runs-on.
  #
  # GHCR pull-through registry cache avoids rebuild of base layers.
  # Storage-delta instrumentation captures df/docker system df pre+post
  # so root can calibrate prune cadence against measured accumulation.
  #
  # concurrency group prevents stacking on the single gentux runner.
  # ------------------------------------------------------------------
  docker-build-os-canari-cli:
    name: Docker Build OS (mika-runtime-cli — self-hosted gentux canari)
    runs-on: [self-hosted, gentux, docker]
    needs: docker-build-filter
    if: github.event_name == 'pull_request' && needs.docker-build-filter.outputs.os-relevant == 'true'
    concurrency:
      group: docker-canari-cli-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Storage delta — BEFORE
        run: |
          echo "=== canari mika-runtime-cli — BEFORE build ==="
          df -h /
          docker system df
      - name: Build mika-runtime-cli
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v6
        with:
          context: .
          file: os/Dockerfile
          target: mika-runtime-cli
          tags: mika-runtime-cli:ci
          push: false
          load: true
          cache-from: type=registry,ref=ghcr.io/senara-solutions/mika-cache:mika-runtime-cli
          cache-to: type=registry,ref=ghcr.io/senara-solutions/mika-cache:mika-runtime-cli,mode=max
          platforms: linux/amd64
      - name: Storage delta — AFTER
        if: always()
        run: |
          echo "=== canari mika-runtime-cli — AFTER build ==="
          df -h /
          docker system df

  security:
    name: Security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Install Rust toolchain
        run: rustup show  # reads rust-toolchain.toml
      - name: Install security tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Run cargo-audit
        run: cargo audit
      - name: Run cargo-deny
        run: cargo deny check
