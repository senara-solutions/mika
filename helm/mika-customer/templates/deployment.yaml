apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mika-customer.name" . }}
  labels:
    {{- include "mika-customer.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — cannot have two pods mounting simultaneously
  selector:
    matchLabels:
      {{- include "mika-customer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mika-customer.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mika-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MIKA_CUSTOMER_ID
              value: {{ .Values.customer.id | quote }}
            - name: MIKA_HOME
              value: "/home/mika/.mika"
            - name: MIKA_SERVER_PORT
              value: "8080"
            - name: MIKA_ROUTING_URL
              value: {{ .Values.gateway.url | quote }}
            - name: MIKA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.claudeModel }}
            - name: MIKA_CLAUDE_MODEL
              value: {{ .Values.claudeModel | quote }}
            {{- end }}
            - name: MIKA_ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mika-customer.name" . }}-secrets
                  key: anthropic-api-key
            - name: MIKA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "mika-customer.name" . }}-secrets
                  key: internal-token
          volumeMounts:
            - name: data
              mountPath: /home/mika/.mika
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mika-customer.name" . }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
