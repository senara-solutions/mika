apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mika-customer.name" . }}-data
  labels:
    {{- include "mika-customer.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
