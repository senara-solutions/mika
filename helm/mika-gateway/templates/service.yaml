apiVersion: v1
kind: Service
metadata:
  name: {{ include "mika-gateway.name" . }}
  labels:
    {{- include "mika-gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mika-gateway.selectorLabels" . | nindent 4 }}
