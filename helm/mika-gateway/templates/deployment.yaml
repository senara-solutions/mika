apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mika-gateway.name" . }}
  labels:
    {{- include "mika-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mika-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mika-gateway.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mika-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MIKA_GATEWAY_PORT
              value: "8080"
            - name: MIKA_TELEGRAM_WEBHOOK_URL
              value: {{ .Values.telegram.webhookUrl | quote }}
            - name: MIKA_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: MIKA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mika-gateway-secrets
                  key: database-url
            - name: MIKA_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mika-gateway-secrets
                  key: telegram-bot-token
            - name: MIKA_TELEGRAM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mika-gateway-secrets
                  key: telegram-webhook-secret
            - name: MIKA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mika-gateway-secrets
                  key: internal-token
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 12
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
