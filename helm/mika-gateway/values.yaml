image:
  repository: ""  # ECR repo, e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/mika-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
# imagePullSecrets:
#   - name: ecr-credentials

replicas: 1  # Single replica to start; bump to 2+ when HA is needed

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    # No CPU limit — gateway is I/O-bound (Telegram API + Postgres). CPU limits cause CFS throttling.

# Non-secret config
telegram:
  webhookUrl: ""  # e.g., https://mika.example.com/webhook/telegram

logLevel: "info"

ingress:
  enabled: false
  className: ""
  host: ""  # e.g., mika.example.com
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: []
  # - secretName: mika-tls
  #   hosts:
  #     - mika.example.com
