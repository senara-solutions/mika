{% extends "base.html" %}
{% block title %}Settings - Mika{% endblock %}
{% block body %}
<nav>
    <div class="container">
        <a href="/dashboard" class="brand">Mika</a>
        <div class="nav-links">
            <a href="/dashboard/settings">Settings</a>
            <a href="/logout">Log out</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="sidebar-layout">
        <div class="sidebar">
            <a href="/dashboard">Overview</a>
            <a href="/dashboard/memory">Memory</a>
            <a href="/dashboard/conversations">Conversations</a>
            <a href="/dashboard/settings" class="active">Settings</a>
        </div>
        <div class="main-content">
            <h1>Settings</h1>
            {% if request.query_params.get('saved') %}
            <div class="alert alert-success">Settings saved.</div>
            {% endif %}
            <form method="POST" action="/dashboard/settings">
                <div class="form-group">
                    <label for="timezone">Timezone</label>
                    <select id="timezone" name="timezone">
                        <option value="UTC" {% if user.timezone == 'UTC' %}selected{% endif %}>UTC</option>
                        <option value="America/New_York" {% if user.timezone == 'America/New_York' %}selected{% endif %}>Eastern (US)</option>
                        <option value="America/Chicago" {% if user.timezone == 'America/Chicago' %}selected{% endif %}>Central (US)</option>
                        <option value="America/Denver" {% if user.timezone == 'America/Denver' %}selected{% endif %}>Mountain (US)</option>
                        <option value="America/Los_Angeles" {% if user.timezone == 'America/Los_Angeles' %}selected{% endif %}>Pacific (US)</option>
                        <option value="Europe/London" {% if user.timezone == 'Europe/London' %}selected{% endif %}>London</option>
                        <option value="Europe/Paris" {% if user.timezone == 'Europe/Paris' %}selected{% endif %}>Paris</option>
                        <option value="Europe/Berlin" {% if user.timezone == 'Europe/Berlin' %}selected{% endif %}>Berlin</option>
                        <option value="Asia/Tokyo" {% if user.timezone == 'Asia/Tokyo' %}selected{% endif %}>Tokyo</option>
                        <option value="Asia/Singapore" {% if user.timezone == 'Asia/Singapore' %}selected{% endif %}>Singapore</option>
                        <option value="Australia/Sydney" {% if user.timezone == 'Australia/Sydney' %}selected{% endif %}>Sydney</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="preferred_channel">Preferred Channel</label>
                    <select id="preferred_channel" name="preferred_channel">
                        <option value="telegram" {% if user.preferred_channel == 'telegram' %}selected{% endif %}>Telegram</option>
                        <option value="whatsapp" {% if user.preferred_channel == 'whatsapp' %}selected{% endif %}>WhatsApp</option>
                    </select>
                </div>
                <button type="submit" class="btn">Save Settings</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
