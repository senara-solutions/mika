# Builtin skill template — tool names must match mika-agent::tools definitions.
# See crates/mika-agent/src/tools/ for the canonical tool registry.
name = "reminders"
description = "Create, list, and manage reminders"

[triggers]
keywords = ["remind", "reminder", "schedule", "alarm", "alert"]

[handler]
type = "builtin"
tools = ["create_reminder", "list_reminders", "cancel_reminder"]

[options]
always_on = true
