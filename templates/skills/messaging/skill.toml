# Builtin skill template — tool names must match mika-agent::tools definitions.
# See crates/mika-agent/src/tools/ for the canonical tool registry.
name = "messaging"
description = "Send messages to the user proactively"

[triggers]
keywords = ["send", "message", "notify"]

[handler]
type = "builtin"
tools = ["send_message"]

[options]
always_on = true
